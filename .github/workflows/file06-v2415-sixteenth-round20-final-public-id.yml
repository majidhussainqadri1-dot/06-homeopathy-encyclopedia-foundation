name: File 06 v2.4.15 Sixteenth Round 20 Final Public-ID Correction
on:
  push:
    branches: [audit/file-06-sixteenth-twenty-round-v2.4.15]
    paths: [.github/workflows/file06-v2415-sixteenth-round20-final-public-id.yml]
permissions:
  contents: write
jobs:
  correct-and-retest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Apply final R20 correction and retest complete inherited state
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 scripts/v2415-round20-final-public-id-fix.py
          php tests/v2415-round20-public-id-regressions.php
          V2415_ROUND=20 php tests/v2415-sixteenth-twenty-round-regressions.php
          bash tests/run-all.sh 2>&1 | tee /tmp/v2415-r20-final.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/v2415-r20-final.log; then
            echo 'Unexpected PHP warning/error after final R20 correction' >&2; exit 1
          fi
          git add -A
          git commit -m "fix(file-06): finalize sixteenth review round 20 public-ID boundary"
          git push origin HEAD:audit/file-06-sixteenth-twenty-round-v2.4.15
