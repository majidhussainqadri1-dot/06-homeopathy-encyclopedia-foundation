name: File 06 v2.4.10 Round 6 Apply
on:
  push:
    branches: [audit/file-06-eleventh-ten-round-v2.4.10]
    paths: [.github/workflows/file06-v2410-round6-apply.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: audit/file-06-eleventh-ten-round-v2.4.10}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - run: python3 scripts/v2410-round6-fix.py
      - run: |
          php tests/v2410-eleventh-ten-round-regressions.php
          bash tests/run-all.sh
          php -l homeopathy-encyclopedia/includes/class-he-v22-governance.php
      - run: |
          git config user.name majidhussainqadri1-dot
          git config user.email majidhussainqadri1@gmail.com
          git add homeopathy-encyclopedia/includes/class-he-v22-governance.php tests/v2410-eleventh-ten-round-regressions.php
          git commit -m 'fix(file-06): bind research integrity apply to object authorization'
          git push origin HEAD:audit/file-06-eleventh-ten-round-v2.4.10
