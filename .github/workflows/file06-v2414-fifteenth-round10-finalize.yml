name: File 06 v2.4.14 Fifteenth Round 10 Finalize
on:
  push:
    branches: [audit/file-06-fifteenth-ten-round-v2.4.14]
    paths: [.github/workflows/file06-v2414-fifteenth-round10-finalize.yml]
permissions:
  contents: write
jobs:
  review-fix-retest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Complete round 10 on corrected state
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/v2411-twelfth-ten-round-regressions.php')
          s=p.read_text(); old='(?:11|12|13)'; new='(?:11|12|13|14)'
          if old not in s: raise SystemExit('v2411 historical version guard marker missing')
          p.write_text(s.replace(old,new))
          p=Path('tests/v2412-thirteenth-ten-round-regressions.php')
          s=p.read_text(); old='(?:12|13)'; new='(?:12|13|14)'
          if old not in s: raise SystemExit('v2412 historical version guard marker missing')
          p.write_text(s.replace(old,new))
          PY
          python3 scripts/v2414-fifteenth-ten-round-fixes.py 10
          V2414_ROUND=10 php tests/v2414-fifteenth-ten-round-regressions.php
          bash tests/run-all.sh 2>&1 | tee /tmp/v2414-round-10-final.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/v2414-round-10-final.log; then
            echo 'Unexpected PHP warning/error in round 10 finalization' >&2
            exit 1
          fi
          git add -A
          git commit -m "fix(file-06): fifteenth review round 10 correction"
          git push origin HEAD:audit/file-06-fifteenth-ten-round-v2.4.14
