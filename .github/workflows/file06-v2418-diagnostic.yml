name: File 06 v2.4.18 Semantic Diagnostic
on:
  push:
    branches: [audit/file-06-nineteenth-twenty-round-v2.4.18]
    paths: [.github/workflows/file06-v2418-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect remaining semantic surfaces
        run: |
          set -euo pipefail
          echo '=== DOMAIN DATASET ==='
          grep -n -A90 -B10 'function request_dataset_access' homeopathy-encyclopedia/includes/class-he-v2-domain.php || true
          grep -n -A90 -B10 'function approve_dataset_access' homeopathy-encyclopedia/includes/class-he-v2-domain.php || true
          echo '=== DOMAIN VERSIONS ==='
          grep -n -A80 -B10 'function versions' homeopathy-encyclopedia/includes/class-he-v2-domain.php || true
          grep -n -A80 -B10 'function version_diff' homeopathy-encyclopedia/includes/class-he-v2-domain.php || true
          echo '=== PUBLIC SEARCH CURSORS ==='
          grep -n -A110 -B10 'function search' homeopathy-encyclopedia/includes/class-he-v2-domain.php || true
          grep -n -A100 -B10 'function browse_research' homeopathy-encyclopedia/includes/class-he-v2-api.php || true
          echo '=== FUTURE PROVENANCE CALLS ==='
          grep -n -B8 -A12 'append_provenance' homeopathy-encyclopedia/includes/class-he-v24-future-api.php || true
          echo '=== FUTURE NUMERIC READ ROUTES ==='
          grep -n "future/graph\|future/time-machine\|future/freshness\|future/citations" homeopathy-encyclopedia/includes/class-he-v24-future-api.php || true
          echo '=== PUBLIC PROVENANCE GUARD ==='
          cat homeopathy-encyclopedia/includes/class-he-v24-public-provenance.php
          echo '=== THIRD AUDIT STALE ROUTES ==='
          grep -nE 'integrity/|research/|datasets/|dataset-access/|future/external/' homeopathy-encyclopedia/includes/class-he-v242-third-audit.php || true
          echo '=== ASSIGNMENT WRITES ==='
          grep -n -A55 -B10 'function save_editor_scope' homeopathy-encyclopedia/includes/class-he-v241-governance.php || true
          grep -n -A75 -B10 'function save_reviewer_assignment' homeopathy-encyclopedia/includes/class-he-v241-governance.php || true
          grep -n -A65 -B10 'function assign' homeopathy-encyclopedia/includes/class-he-v241-research-governance.php || true
          echo '=== DONE ==='
