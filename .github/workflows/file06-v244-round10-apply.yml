name: File 06 v2.4.4 Ten-Round Review Round 10 Fix Retry
on:
  push:
    branches:
      - audit/file-06-fifth-ten-round-v2.4.4
    paths:
      - .github/workflows/file06-v244-round10-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply round-10 correction
        run: python3 scripts/v244-ten-round-round10.py
      - name: Validate correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          php -l tests/v243-ten-round-regressions.php
          php -l tests/v244-ten-round-regressions.php
          bash -n tests/run-all.sh
          php tests/v244-ten-round-regressions.php
          bash tests/run-all.sh
      - name: Commit corrected owning QA and release truth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add tests/run-all.sh tests/v243-ten-round-regressions.php tests/v244-ten-round-regressions.php README.md STATUS.md
          git commit -m 'test(file-06): close fifth ten-round aggregate regression gate'
          git push origin HEAD:audit/file-06-fifth-ten-round-v2.4.4
