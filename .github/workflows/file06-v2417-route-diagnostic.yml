name: File 06 v2.4.17 R20 Final Correction
on:
  push:
    branches:
      - audit/file-06-eighteenth-twenty-round-v2.4.17
    paths:
      - .github/workflows/file06-v2417-route-diagnostic.yml
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply R20 correction and full inherited QA
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 scripts/v2417-r20-final-correction.py
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
          node --check homeopathy-encyclopedia/assets/js/encyclopedia-v2.js
          FILE06_REVIEW_ROUND=20 php tests/v2417-eighteenth-twenty-round-regressions.php
          bash tests/run-all.sh 2>&1 | tee /tmp/v2417-r20-correction.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/v2417-r20-correction.log; then
            echo 'Unexpected warning/error in R20 correction aggregate QA' >&2
            exit 1
          fi
          git rm .github/workflows/file06-v2417-route-diagnostic.yml
          git add -A
          git commit -m "fix(file-06): correct R20 residual legacy routes and object scope"
          git push origin HEAD:audit/file-06-eighteenth-twenty-round-v2.4.17
