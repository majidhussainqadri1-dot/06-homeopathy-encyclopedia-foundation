name: File 06 v2.4.17 R20 Marker Diagnostic
on:
  push:
    branches:
      - audit/file-06-eighteenth-twenty-round-v2.4.17
    paths:
      - .github/workflows/file06-v2417-route-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply correction in workspace and inspect semantic markers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/v2417-r20-final-correction.py')
          s=p.read_text(encoding='utf-8')
          a=s.find("p=ROOT/'tests'/'v2417-eighteenth-twenty-round-regressions.php'; s=read(p)")
          b=s.find("p=ROOT/'.github'/'workflows'/'file06-v2417-eighteenth-twenty-round-final.yml'; s=read(p)")
          if a < 0 or b < 0 or b <= a: raise SystemExit('test edit block missing')
          p.write_text(s[:a]+'# skip committed regression rewrite\n\n'+s[b:],encoding='utf-8')
          PY
          python3 scripts/v2417-r20-final-correction.py
          echo '=== V23 HOOKS ==='
          grep -n "retire legacy v2.3 runtime surfaces\|rest_api_init\|add_action( self::CRON" homeopathy-encyclopedia/includes/class-he-v23-future.php || true
          echo '=== REVIEW GUARD ==='
          grep -n "future/external\|future/translations.*review\|future/translations.*publish\|decode_public_cursor( 'external-record'" homeopathy-encyclopedia/includes/class-he-v24-future-review-guard.php || true
          echo '=== GOVERNANCE ==='
          grep -n "integrity/.*apply\|research/.*transition\|dataset-access/.*approve\|future/external/.*review\|review.*match\[[23]\]" homeopathy-encyclopedia/includes/class-he-v241-governance.php || true
          echo '=== LEDGER ==='
          tail -n 3 docs/FILE-06-v2.4.17-EIGHTEENTH-TWENTY-ROUND-REVIEW.md
          echo '=== R20 TEST RESULT ==='
          FILE06_REVIEW_ROUND=20 php tests/v2417-eighteenth-twenty-round-regressions.php || true
