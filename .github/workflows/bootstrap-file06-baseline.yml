name: File 06 Baseline Bootstrap

on:
  push:
    branches: [ baseline/file-06-original-import ]
    paths:
      - '.file06-bootstrap/READY'

permissions:
  contents: write

jobs:
  apply-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: baseline/file-06-original-import
      - name: Reassemble and verify baseline overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .file06-bootstrap/overlay.part* > /tmp/file06-overlay.b64
          base64 --decode /tmp/file06-overlay.b64 > /tmp/file06-overlay.tar.gz
          echo '5844ed92580bb0a79c4279bebcbedfe8d2f88007a6b76d63853c97e24d29f7be  /tmp/file06-overlay.tar.gz' | sha256sum --check --strict
          if tar -tzf /tmp/file06-overlay.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe archive path detected.' >&2
            exit 1
          fi
          tar -xzf /tmp/file06-overlay.tar.gz -C .
      - name: Validate exact source before commit
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --strict CHECKSUMS.sha256
          expected="$(awk '{print $2}' CHECKSUMS.sha256 | LC_ALL=C sort)"
          actual="$(find homeopathy-encyclopedia -type f -print | LC_ALL=C sort)"
          test "$expected" = "$actual"
          test "$(find homeopathy-encyclopedia -type f | wc -l)" -eq 17
          test "$(find homeopathy-encyclopedia -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')" -eq 66071
          echo 'b69f4452f5be64ba3ae7002b7767be46375904a98ae9d484f899d27c14c7bc20  CHECKSUMS.sha256' | sha256sum --check --strict
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia -type f -name '*.php' -print0 | sort -z)
      - name: Commit exact File 06 baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add homeopathy-encyclopedia README.md SOURCE-PROVENANCE.md MANIFEST.md CHECKSUMS.sha256 STATUS.md BASELINE-REVIEW.md .gitignore
          git commit -m 'Import exact File 06 source baseline'
          git push origin HEAD:baseline/file-06-original-import
