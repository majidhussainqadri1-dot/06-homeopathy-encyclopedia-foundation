name: File 06 Corrective Integrity

on:
  push:
    branches: [ audit/file-06-source-review ]
    paths:
      - 'homeopathy-encyclopedia/**'
      - 'CORRECTIVE-CHECKSUMS.sha256'
      - 'CORRECTIVE-MANIFEST.md'
      - 'CORRECTIVE-REVIEW.md'
      - 'README.md'
      - 'STATUS.md'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  source-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify corrected source checksums
        run: sha256sum --check --strict CORRECTIVE-CHECKSUMS.sha256
      - name: Verify source and architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(find homeopathy-encyclopedia -type f | wc -l)" -eq 19
          test "$(find homeopathy-encyclopedia -type f -name '*.php' | wc -l)" -eq 15
          test "$(find homeopathy-encyclopedia -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')" -eq 138665
          test "$(python3 scripts/source-tree-hash.py homeopathy-encyclopedia)" = "f336ce4f9996f64455ccae922b34379e3ae053a85f8d34cfde2784ff319f549b"
          bash tests/source-invariants.sh
      - name: Run deterministic security invariants
        run: php tests/security-invariants.php

  php-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all plugin and test PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)

  reproducible-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build twice and compare
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-release.py --source homeopathy-encyclopedia --output /tmp/file06-a.zip
          python3 scripts/build-release.py --source homeopathy-encyclopedia --output /tmp/file06-b.zip
          cmp -s /tmp/file06-a.zip /tmp/file06-b.zip
          echo '14800cf27df796b0972164b0bb75922ce9d851c35f7a7e31a4a95943b1149fb1  /tmp/file06-a.zip' | sha256sum --check --strict
          test "$(stat -c '%s' /tmp/file06-a.zip)" -eq 44284
