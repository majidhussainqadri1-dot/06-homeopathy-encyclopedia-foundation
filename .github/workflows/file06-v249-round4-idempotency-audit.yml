name: File 06 v2.4.9 Round 4 Idempotency Audit
on:
  push:
    paths:
      - .github/workflows/file06-v249-round4-idempotency-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Locate all idempotency finalizers and mutation helpers
        run: |
          set -euo pipefail
          grep -R -n --include='*.php' -F 'idempotent_finish(' homeopathy-encyclopedia || true
          echo '=== finish helpers ==='
          grep -R -n --include='*.php' -E 'function (finish|mutation_finish|mutation_response)' homeopathy-encyclopedia || true
