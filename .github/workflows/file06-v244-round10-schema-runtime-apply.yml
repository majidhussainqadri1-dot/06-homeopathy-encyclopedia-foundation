name: File 06 v2.4.4 Round 10 Hidden Schema Runtime Fix
on:
  push:
    branches:
      - audit/file-06-fifth-ten-round-v2.4.4
    paths:
      - '.github/workflows/file06-v244-round10-schema-runtime-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply hidden schema/runtime correction
        run: python3 scripts/v244-round10-schema-runtime-fix.py
      - name: Validate corrected source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          php -l homeopathy-encyclopedia/includes/class-he-v24-future-schema.php
          php -l homeopathy-encyclopedia/homeopathy-encyclopedia.php
          php -l tests/v244-ten-round-regressions.php
          bash tests/run-all.sh
      - name: Commit corrected owning source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add homeopathy-encyclopedia/includes/class-he-v24-future-schema.php homeopathy-encyclopedia/homeopathy-encyclopedia.php tests/v244-ten-round-regressions.php
          git commit -m 'fix(file-06): make V24 schema authoritative and dbDelta-safe'
          git push origin HEAD:audit/file-06-fifth-ten-round-v2.4.4
