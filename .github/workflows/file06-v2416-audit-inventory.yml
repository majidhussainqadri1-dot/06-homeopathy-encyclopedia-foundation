name: File 06 v2.4.16 Seventeenth Audit Inventory
on:
  push:
    branches: [audit/file-06-seventeenth-twenty-round-v2.4.16]
    paths: [.github/workflows/file06-v2416-audit-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Static audit inventory
        run: |
          set -euo pipefail
          echo '=== NUMERIC REST ROUTES ==='
          grep -RInE "register_rest_route.*\\\\d\+|register_rest_route.*\\(\?P<id>\\\\d" homeopathy-encyclopedia/includes || true
          echo '=== NUMERIC REQUEST ID LOOKUPS ==='
          grep -RInE "absint\(.*request\['id'\]|WHERE id=%d.*request\['id'\]" homeopathy-encyclopedia/includes || true
          echo '=== PUBLIC/PRIVATE RESPONSE IDENTIFIERS ==='
          grep -RInE "'id'[[:space:]]*=>[[:space:]]*\(int\)|'request_id'[[:space:]]*=>[[:space:]]*\(int\)|'version_id'[[:space:]]*=>" homeopathy-encyclopedia/includes || true
          echo '=== RAW DELETE/UPDATE/INSERT FAILURE SITES ==='
          grep -RInE "\$wpdb->(insert|update|delete|query)\(" homeopathy-encyclopedia/includes/class-he-v2-domain.php | head -n 250 || true
          echo '=== DIRECT OPTION SCHEMA COMPLETENESS ==='
          grep -RInE "schema_complete|required_tables|SHOW COLUMNS|SHOW INDEX" homeopathy-encyclopedia/includes || true
          echo '=== TODO/FIXME/DEPRECATED/LEGACY ==='
          grep -RInE "TODO|FIXME|deprecated|legacy|unsafe" homeopathy-encyclopedia/includes homeopathy-encyclopedia/homeopathy-encyclopedia.php | head -n 300 || true
          echo '=== CURRENT TEST SUITE ==='
          bash tests/run-all.sh
