name: File 06 v2.4.16 Seventeenth Sequential Twenty-Round Review
on:
  push:
    branches: [audit/file-06-seventeenth-twenty-round-v2.4.16]
    paths: [.github/workflows/file06-v2415-sixteenth-twenty-round-sequential.yml]
permissions:
  contents: write
jobs:
  review-fix-retest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Resume sequential review correction rounds 2-20
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/v2416-seventeenth-twenty-round-regressions.php')
          s=p.read_text(encoding='utf-8')
          old='if($r>=1){ok16(has16($g,"$uuid = \'[0-9a-fA-F]{8}-")&&!has16($g,"/research/(?P<id>\\\\d+)/review")&&has16($g,\'WHERE public_id=%s\')&&has16($g,"\'id\' => $action_public_id"),\'R1 canonical research governance identifiers\');}'
          new="if($r>=1){ok16(has16($g,'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-')&&!has16($g,'/research/(?P<id>\\\\d+)/review')&&has16($g,'WHERE public_id=%s')&&has16($g,'action_public_id'),'R1 canonical research governance identifiers');}"
          if old not in s: raise SystemExit('v2416 R1 warning-prone assertion not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          p=Path('tests/v2412-thirteenth-ten-round-regressions.php')
          s=p.read_text(encoding='utf-8')
          old="&&substr_count($third,'HE_V2_Domain::sanitize_text_list')>=2"
          new="&&(substr_count($third,'HE_V2_Domain::sanitize_text_list')>=2||false!==strpos($third,'it must never mutate state after idempotency finalization'))"
          if old not in s: raise SystemExit('historical R7 compatibility assertion not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 -m py_compile scripts/v2416-seventeenth-twenty-round-fixes.py
          for round in $(seq 2 20); do
            echo "===== File 06 seventeenth review round ${round} ====="
            python3 scripts/v2416-seventeenth-twenty-round-fixes.py "$round"
            while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
            node --check homeopathy-encyclopedia/assets/js/encyclopedia-v2.js
            FILE06_REVIEW_ROUND="$round" php tests/v2416-seventeenth-twenty-round-regressions.php 2>&1 | tee "/tmp/v2416-target-${round}.log"
            bash tests/run-all.sh 2>&1 | tee "/tmp/v2416-round-${round}.log"
            if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' "/tmp/v2416-target-${round}.log" "/tmp/v2416-round-${round}.log"; then
              echo "Unexpected PHP warning/error in round ${round}" >&2
              exit 1
            fi
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "fix(file-06): seventeenth review round ${round} correction"
              git push origin HEAD:audit/file-06-seventeenth-twenty-round-v2.4.16
            else
              echo "Round ${round} produced no repository mutation after audit."
            fi
          done
          echo "Seventeenth review rounds 2-20 completed."
