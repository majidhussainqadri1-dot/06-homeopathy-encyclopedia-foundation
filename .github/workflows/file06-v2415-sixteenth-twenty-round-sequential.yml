name: File 06 v2.4.16 Seventeenth Sequential Twenty-Round Review
on:
  push:
    branches: [audit/file-06-seventeenth-twenty-round-v2.4.16]
    paths: [.github/workflows/file06-v2415-sixteenth-twenty-round-sequential.yml]
permissions:
  contents: write
jobs:
  review-fix-retest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Resume sequential review correction rounds 7-20
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/v2414-fifteenth-ten-round-regressions.php')
          s=p.read_text(encoding='utf-8')
          old="v2414_ok(3,false!==strpos($domain,'entry_create_compensation_start_failed')&&false!==strpos($domain,'entry-child-delete-failed-')&&false!==strpos($domain,'entry-create-compensation-commit-failed')&&false!==strpos($domain,'entry_create_post_compensation_failed'),'entry-create compensation can silently partially fail');"
          new="$r3_legacy=false!==strpos($domain,'entry_create_compensation_start_failed')&&false!==strpos($domain,'entry-child-delete-failed-')&&false!==strpos($domain,'entry-create-compensation-commit-failed')&&false!==strpos($domain,'entry_create_post_compensation_failed');\n$r3_stronger=false!==strpos($domain,'entry_create_compensation_start_failed')&&false!==strpos($domain,'entry-child-delete-failed')&&false!==strpos($domain,'entry-compensation-commit-failed')&&false!==strpos($domain,'entry_create_compensation_failed')&&false!==strpos($domain,\"remove_filter( 'pre_delete_post', $delete_guard, 1 )\");\nv2414_ok(3,$r3_legacy||$r3_stronger,'entry-create compensation can silently partially fail');"
          if old not in s: raise SystemExit('v2414 R3 historical assertion not found')
          s=s.replace(old,new,1)
          old="v2414_ok(9,false!==strpos($domain,\"'retracted' !== \\$row['status'] ? json_decode( \\$row['case_json'], true ) : null\")&&false!==strpos($domain,\"'public' !== \\$row['data_class'] || 'retracted' === \\$row['status']\")&&false!==strpos($domain,\"'publish' !== \\$post->post_status\")&&false!==strpos($browse,\"'public' === \\$row['data_class'] && 'retracted' !== \\$row['status']\"),'retracted research REST/browse payloads or stale deleted posts can remain publicly detailed');"
          new="$r9_legacy=false!==strpos($domain,\"'retracted' !== \\$row['status'] ? json_decode( \\$row['case_json'], true ) : null\")&&false!==strpos($domain,\"'public' !== \\$row['data_class'] || 'retracted' === \\$row['status']\")&&false!==strpos($domain,\"'publish' !== \\$post->post_status\");\n$r9_stronger=false!==strpos($domain,'$public_metadata = array_intersect_key')&&false!==strpos($domain,\"'publish' !== \\$post->post_status\")&&false!==strpos($domain,\"( \\$private || 'public' === \\$row['data_class'] )\");\nv2414_ok(9,($r9_legacy||$r9_stronger)&&false!==strpos($browse,\"'public' === \\$row['data_class'] && 'retracted' !== \\$row['status']\"),'retracted research REST/browse payloads or stale deleted posts can remain publicly detailed');"
          if old not in s: raise SystemExit('v2414 R9 historical assertion not found')
          s=s.replace(old,new,1)
          s=s.replace("(?:14|15)","(?:14|15|16)").replace("(?:14|15)-a", "(?:14|15|16)-a")
          p.write_text(s,encoding='utf-8')
          p=Path('tests/v2415-sixteenth-twenty-round-regressions.php')
          s=p.read_text(encoding='utf-8')
          old="v2415_ok(20,false!==strpos($bootstrap,' * Version: 2.4.15')&&false!==strpos($bootstrap,\"HE_VERSION', '2.4.15\")&&false!==strpos($bootstrap,\"HE_CONTRACT_VERSION', '2.4.15\")&&false!==strpos($bootstrap,\"'future_hardening_version'=>'2.4.15'\")&&false!==strpos($readme,'Stable tag: 2.4.15')&&false!==strpos($runall,'v2415-sixteenth-twenty-round-regressions.php')&&false!==strpos($runall,'All File 06 v2.4.15 automated checks'),'v2.4.15 runtime/release/current QA truth is not aligned');"
          new="v2415_ok(20,preg_match('/ \\* Version: 2\\.4\\.(?:15|16)/',$bootstrap)&&preg_match(\"/HE_VERSION', '2\\\\.4\\\\.(?:15|16)/\",$bootstrap)&&preg_match(\"/HE_CONTRACT_VERSION', '2\\\\.4\\\\.(?:15|16)/\",$bootstrap)&&false!==strpos($bootstrap,\"'future_hardening_version'=>\")&&preg_match('/Stable tag: 2\\.4\\.(?:15|16)/',$readme)&&false!==strpos($runall,'v2415-sixteenth-twenty-round-regressions.php')&&preg_match('/All File 06 v2\\.4\\.(?:15|16) automated checks/',$runall),'historical v2.4.15 release controls do not tolerate the current v2.4.x candidate');"
          if old not in s: raise SystemExit('v2415 R20 historical assertion not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 -m py_compile scripts/v2416-seventeenth-twenty-round-fixes.py
          for round in $(seq 7 20); do
            echo "===== File 06 seventeenth review round ${round} ====="
            python3 scripts/v2416-seventeenth-twenty-round-fixes.py "$round"
            while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
            node --check homeopathy-encyclopedia/assets/js/encyclopedia-v2.js
            FILE06_REVIEW_ROUND="$round" php tests/v2416-seventeenth-twenty-round-regressions.php 2>&1 | tee "/tmp/v2416-target-${round}.log"
            bash tests/run-all.sh 2>&1 | tee "/tmp/v2416-round-${round}.log"
            if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' "/tmp/v2416-target-${round}.log" "/tmp/v2416-round-${round}.log"; then
              echo "Unexpected PHP warning/error in round ${round}" >&2
              exit 1
            fi
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "fix(file-06): seventeenth review round ${round} correction"
              git push origin HEAD:audit/file-06-seventeenth-twenty-round-v2.4.16
            else
              echo "Round ${round} produced no repository mutation after audit."
            fi
          done
          echo "Seventeenth review rounds 7-20 completed."
