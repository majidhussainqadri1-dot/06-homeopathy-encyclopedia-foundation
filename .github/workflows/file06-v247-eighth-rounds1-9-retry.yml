      - name: Round 9 - research integrity apply concurrency
        run: |
          set -euo pipefail
          python3 scripts/v247-eighth-ten-round-apply.py 9
          python3 scripts/v247-eighth-ten-round-tests.py 9
          php -l homeopathy-encyclopedia/includes/class-he-v22-governance.php
