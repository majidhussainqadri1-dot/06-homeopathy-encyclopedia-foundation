name: File 06 v2.4.7 Eighth Review Rounds 1-9 Retry
on:
  push:
    branches: [audit/file-06-eighth-ten-round-v2.4.7]
    paths: [.github/workflows/file06-v247-eighth-rounds1-9-retry.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/file-06-eighth-ten-round-v2.4.7
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Configure Git
        run: |
          git config user.name majidhussainqadri1-dot
          git config user.email majidhussainqadri1@gmail.com
      - name: Round 1 - research external-review assignment
        run: |
          set -euo pipefail
          python3 scripts/v247-eighth-ten-round-apply.py 1
          python3 scripts/v247-eighth-ten-round-tests.py 1
          php -l homeopathy-encyclopedia/includes/class-he-v241-governance.php
          php -l homeopathy-encyclopedia/includes/class-he-v241-runtime-guard.php
          php tests/v247-eighth-ten-round-regressions.php
          bash tests/run-all.sh
          git diff --check
          git add homeopathy-encyclopedia/includes/class-he-v241-governance.php homeopathy-encyclopedia/includes/class-he-v241-runtime-guard.php tests/v247-eighth-ten-round-regressions.php
          git commit -m 'fix(file-06): bind research external review to reviewer assignment'
          git push origin HEAD:audit/file-06-eighth-ten-round-v2.4.7
      - name: Round 2 - authoritative public research privacy
        run: |
          set -euo pipefail
          python3 scripts/v247-eighth-ten-round-apply.py 2
          python3 scripts/v247-eighth-ten-round-tests.py 2
          php -l homeopathy-encyclopedia/includes/class-he-v22-governance.php
          php tests/v247-eighth-ten-round-regressions.php
          bash tests/run-all.sh
          git diff --check
          git add homeopathy-encyclopedia/includes/class-he-v22-governance.php tests/v247-eighth-ten-round-regressions.php
          git commit -m 'fix(file-06): close shadowed V22 research privacy path'
          git push origin HEAD:audit/file-06-eighth-ten-round-v2.4.7
      - name: Round 3 - merge graph provenance
        run: |
          set -euo pipefail
          python3 scripts/v247-eighth-ten-round-apply.py 3
          python3 scripts/v247-eighth-ten-round-tests.py 3
          php -l homeopathy-encyclopedia/includes/class-he-v22-governance.php
          php tests/v247-eighth-ten-round-regressions.php
          bash tests/run-all.sh
