          git add homeopathy-encyclopedia/includes/class-he-v22-governance.php tests/v247-eighth-ten-round-regressions.php
          git commit -m 'fix(file-06): preserve graph provenance through concept merge'
          git push origin HEAD:audit/file-06-eighth-ten-round-v2.4.7
      - name: Round 4 - current-version search evidence
        run: |
          set -euo pipefail
          python3 scripts/v247-eighth-ten-round-apply.py 4
          python3 scripts/v247-eighth-ten-round-tests.py 4
