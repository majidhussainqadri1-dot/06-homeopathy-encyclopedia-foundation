name: File 06 v2.4.18 R18 Source Correction
on:
  push:
    branches: [audit/file-06-nineteenth-twenty-round-v2.4.18]
    paths: [.github/workflows/file06-v2418-source-correction.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Retire registered numeric public Future read routes
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('homeopathy-encyclopedia/includes/class-he-v24-future-api.php')
          s=p.read_text(encoding='utf-8')
          for line in [
              "\t\tself::route( $ns, '/future/graph/(?P<id>\\\\d+)', 'GET', 'rest_graph', 'read' );\n",
              "\t\tself::route( $ns, '/future/time-machine/(?P<id>\\\\d+)', 'GET', 'rest_time_machine', 'read' );\n",
              "\t\tself::route( $ns, '/future/freshness/(?P<id>\\\\d+)', 'GET', 'rest_freshness', 'read' );\n",
              "\t\tself::route( $ns, '/future/citations/(?P<id>\\\\d+)/(?P<format>[a-z0-9_-]+)', 'GET', 'rest_citations', 'read' );\n",
          ]:
              if s.count(line)!=1: raise SystemExit('R18 legacy route baseline mismatch: '+line.strip())
              s=s.replace(line,'',1)
          old="\t\tif ( ctype_digit( $identifier ) ) { return HE_V24_Future_Schema::concept_row( absint( $identifier ), true ); }\n"
          if s.count(old)!=1: raise SystemExit('R18 numeric public-read fallback baseline mismatch')
          s=s.replace(old,'',1)
          comment="\t\t/* Canonical public-ID surfaces for public Future intelligence reads. Legacy numeric reads remain blocked by HE_V24_Public_Provenance. */"
          replacement="\t\t/* Canonical public-ID surfaces are the only registered public Future intelligence reads. */"
          if s.count(comment)!=1: raise SystemExit('R18 public route comment baseline mismatch')
          p.write_text(s.replace(comment,replacement,1),encoding='utf-8')
          PY
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
          node --check homeopathy-encyclopedia/assets/js/encyclopedia-v2.js
          bash tests/run-all.sh 2>&1 | tee /tmp/r18.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/r18.log; then exit 1; fi
          git add homeopathy-encyclopedia/includes/class-he-v24-future-api.php
          git commit -m "fix(file-06): R18 retire numeric public Future read routes"
          git push origin HEAD:audit/file-06-nineteenth-twenty-round-v2.4.18
