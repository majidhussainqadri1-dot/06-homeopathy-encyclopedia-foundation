name: File 06 v2.4.18 R14 Source Correction
on:
  push:
    branches: [audit/file-06-nineteenth-twenty-round-v2.4.18]
    paths: [.github/workflows/file06-v2418-source-correction.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Make translation publication, provenance and durable impact atomic
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 - <<'PY'
          from pathlib import Path
          schema=Path('homeopathy-encyclopedia/includes/class-he-v24-future-schema.php')
          ss=schema.read_text(encoding='utf-8')
          old="public static function queue_impact( $type, $id, $event, $payload = array(), $consumers = array() ) {"
          new="public static function queue_impact( $type, $id, $event, $payload = array(), $consumers = array(), $notify = true ) {"
          if ss.count(old)!=1: raise SystemExit('R14 queue_impact signature baseline mismatch')
          ss=ss.replace(old,new,1)
          old2="\t\tif ( $queued ) {\n\t\t\tdo_action( 'he_v24_knowledge_impact_queued', $type, $id, $event, $payload );\n\t\t}"
          new2="\t\tif ( $queued && $notify ) {\n\t\t\tdo_action( 'he_v24_knowledge_impact_queued', $type, $id, $event, $payload );\n\t\t}"
          if ss.count(old2)!=1: raise SystemExit('R14 queue notification baseline mismatch')
          schema.write_text(ss.replace(old2,new2,1),encoding='utf-8')

          api=Path('homeopathy-encyclopedia/includes/class-he-v24-future-api.php')
          s=api.read_text(encoding='utf-8')
          a=s.find('\tpublic static function rest_translation_publish( WP_REST_Request $request ) {')
          b=s.find('\n\tpublic static function rest_command_center(',a)
          if a<0 or b<0: raise SystemExit('R14 translation publish method markers missing')
          method="\tpublic static function rest_translation_publish( WP_REST_Request $request ) {\n\t\t$public = strtolower( sanitize_text_field( (string) $request['id'] ) ); $locale = HE_V242_Multilingual::canonical_locale( $request['locale'] );\n\t\t$reservation = self::mutation_guard( $request, 'future-translation-publish-' . sanitize_key( $public . '-' . $locale ), HE_V2_Auth::CAP_PUBLISH );\n\t\tif ( is_wp_error( $reservation ) || ! empty( $reservation['replay'] ) ) { return self::mutation_finish( $reservation, null, 200 ); }\n\t\tglobal $wpdb; $data = self::request_data( $request ); $concepts = HE_V2_Schema::table( 'concepts' );\n\t\tif ( false === $wpdb->query( 'START TRANSACTION' ) ) { return self::mutation_finish( $reservation, new WP_Error( 'he_future_translation_transaction_failed', __( 'The translation publication could not start safely.', 'homeopathy-encyclopedia' ), array( 'status' => 503 ) ) ); }\n\t\ttry {\n\t\t\t$concept = $wpdb->get_row( $wpdb->prepare( \"SELECT id,public_id,current_version FROM {$concepts} WHERE public_id=%s FOR UPDATE\", $public ), ARRAY_A );\n\t\t\t$row = self::translation_row( $public, $locale, true );\n\t\t\tif ( ! $concept || ! $row ) { throw new RuntimeException( 'not-found' ); }\n\t\t\t$expected = absint( $data['translation_version'] ?? 0 );\n\t\t\tif ( ! $expected || $expected !== (int) $row['translation_version'] || (int) $row['source_version'] !== (int) $concept['current_version'] ) { throw new RuntimeException( 'version' ); }\n\t\t\t$changed = $wpdb->query( $wpdb->prepare( \"UPDATE \" . HE_V24_Future_Schema::table( 'translations' ) . \" SET status='published',published_at=UTC_TIMESTAMP(),updated_at=UTC_TIMESTAMP() WHERE id=%d AND translation_version=%d AND status='approved'\", (int) $row['id'], $expected ) );\n\t\t\tif ( 1 !== (int) $changed ) { throw new RuntimeException( 'version' ); }\n\t\t\t$payload = array( 'concept_id' => $public, 'locale' => $locale, 'translation_version' => $expected );\n\t\t\t$prov = HE_V24_Future_Schema::append_provenance( 'translation', $public . ':' . $locale, 'translation.published', '', array( 'translation_version' => $expected ) );\n\t\t\tif ( ! $prov ) { throw new RuntimeException( 'provenance' ); }\n\t\t\t$consumers = array( 'file-05','file-12','file-15','file-16','file-21','file-26' );\n\t\t\t$queued = HE_V24_Future_Schema::queue_impact( 'translation', $public . ':' . $locale, 'KnowledgeTranslationUpdated.v1', $payload, $consumers, false );\n\t\t\tif ( count( $consumers ) !== (int) $queued ) { throw new RuntimeException( 'impact-queue' ); }\n\t\t\tif ( false === $wpdb->query( 'COMMIT' ) ) { throw new RuntimeException( 'commit' ); }\n\t\t} catch ( Throwable $error ) {\n\t\t\t$wpdb->query( 'ROLLBACK' ); $reason = $error->getMessage();\n\t\t\tif ( 'not-found' === $reason ) { $err = new WP_Error( 'he_not_found', __( 'Translation not found.', 'homeopathy-encyclopedia' ), array( 'status' => 404 ) ); }\n\t\t\telseif ( 'version' === $reason ) { $err = new WP_Error( 'he_version_conflict', __( 'The translation is no longer an approved current-source version. Reload and retry.', 'homeopathy-encyclopedia' ), array( 'status' => 409 ) ); }\n\t\t\telse { HE_V2_Schema::record_runtime_failure( 'translation_publish_atomic_failed', 'Translation publication, provenance or downstream impact could not be committed atomically.' ); $err = new WP_Error( 'he_future_translation_publish_failed', __( 'The translation publication could not be saved atomically.', 'homeopathy-encyclopedia' ), array( 'status' => 503 ) ); }\n\t\t\treturn self::mutation_finish( $reservation, $err, 200 );\n\t\t}\n\t\tdo_action( 'he_v24_knowledge_impact_queued', 'translation', $public . ':' . $locale, 'KnowledgeTranslationUpdated.v1', $payload );\n\t\treturn self::mutation_finish( $reservation, array( 'status' => 'published', 'translation_version' => $expected, 'concept_id' => $public, 'locale' => $locale ), 200 );\n\t}\n"
          api.write_text(s[:a]+method+s[b:],encoding='utf-8')
          PY
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
          node --check homeopathy-encyclopedia/assets/js/encyclopedia-v2.js
          bash tests/run-all.sh 2>&1 | tee /tmp/r14.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/r14.log; then exit 1; fi
          git add homeopathy-encyclopedia/includes/class-he-v24-future-api.php homeopathy-encyclopedia/includes/class-he-v24-future-schema.php
          git commit -m "fix(file-06): R14 make translation publication impact atomic"
          git push origin HEAD:audit/file-06-nineteenth-twenty-round-v2.4.18
