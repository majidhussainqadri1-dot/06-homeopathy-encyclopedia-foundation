name: File 06 v2.4.18 R11 Source Correction
on:
  push:
    branches: [audit/file-06-nineteenth-twenty-round-v2.4.18]
    paths: [.github/workflows/file06-v2418-source-correction.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Make claim review and provenance atomic
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('homeopathy-encyclopedia/includes/class-he-v24-future-api.php')
          s=p.read_text(encoding='utf-8')
          a=s.find('\tpublic static function rest_claim_review( WP_REST_Request $request ) {')
          b=s.find('\n\tpublic static function rest_provenance(',a)
          if a<0 or b<0: raise SystemExit('R11 claim review method markers missing')
          new="\tpublic static function rest_claim_review( WP_REST_Request $request ) {\n\t\t$claim_public = strtolower( sanitize_text_field( (string) $request['id'] ) );\n\t\t$reservation = self::mutation_guard( $request, 'future-claim-review-' . sanitize_key( $claim_public ), HE_V2_Auth::CAP_REVIEW );\n\t\tif ( is_wp_error( $reservation ) || ! empty( $reservation['replay'] ) ) { return self::mutation_finish( $reservation, null, 200 ); }\n\t\tglobal $wpdb; $data = self::request_data( $request ); $table = HE_V24_Future_Schema::table( 'claims' );\n\t\tif ( false === $wpdb->query( 'START TRANSACTION' ) ) { return self::mutation_finish( $reservation, new WP_Error( 'he_future_claim_review_failed', __( 'The claim review transaction could not start safely.', 'homeopathy-encyclopedia' ), array( 'status' => 503 ) ) ); }\n\t\ttry {\n\t\t\t$claim = $wpdb->get_row( $wpdb->prepare( \"SELECT * FROM {$table} WHERE public_id=%s FOR UPDATE\", $claim_public ), ARRAY_A );\n\t\t\tif ( ! $claim ) { throw new RuntimeException( 'not-found' ); }\n\t\t\t$reviewer = get_current_user_id();\n\t\t\tif ( (int) $claim['created_by'] === $reviewer && ! HE_V2_Auth::is_founder( $reviewer ) ) { throw new RuntimeException( 'self-review' ); }\n\t\t\t$decision = sanitize_key( $data['decision'] ?? 'changes-required' );\n\t\t\tif ( ! in_array( $decision, array( 'approved','changes-required','rejected' ), true ) ) { throw new RuntimeException( 'decision' ); }\n\t\t\t$expected = absint( $data['row_version'] ?? 0 );\n\t\t\tif ( ! $expected || $expected !== (int) $claim['row_version'] ) { throw new RuntimeException( 'version' ); }\n\t\t\tif ( 'approved' === $decision ) { $count = (int) $wpdb->get_var( $wpdb->prepare( 'SELECT COUNT(*) FROM ' . HE_V24_Future_Schema::table( 'claim_evidence' ) . ' WHERE claim_id=%d', $claim['id'] ) ); if ( $count < 1 ) { throw new RuntimeException( 'evidence' ); } }\n\t\t\t$status = 'changes-required' === $decision ? 'pending' : $decision;\n\t\t\t$updated = $wpdb->query( $wpdb->prepare( \"UPDATE {$table} SET review_status=%s,reviewed_by=%d,row_version=row_version+1,updated_at=UTC_TIMESTAMP() WHERE id=%d AND row_version=%d\", $status, $reviewer, $claim['id'], $expected ) );\n\t\t\tif ( 1 !== (int) $updated ) { throw new RuntimeException( 'version' ); }\n\t\t\t$provenance = HE_V24_Future_Schema::append_provenance( 'claim', (string) $claim['id'], 'claim.reviewed', '', array( 'decision' => $decision ) );\n\t\t\tif ( ! $provenance ) { throw new RuntimeException( 'provenance' ); }\n\t\t\tif ( false === $wpdb->query( 'COMMIT' ) ) { throw new RuntimeException( 'commit' ); }\n\t\t} catch ( Throwable $error ) {\n\t\t\t$wpdb->query( 'ROLLBACK' ); $reason = $error->getMessage();\n\t\t\tif ( 'not-found' === $reason ) { $err = new WP_Error( 'he_not_found', __( 'Claim not found.', 'homeopathy-encyclopedia' ), array( 'status' => 404 ) ); }\n\t\t\telseif ( 'self-review' === $reason ) { $err = new WP_Error( 'he_independent_review_required', __( 'The claim author cannot provide the independent approval review.', 'homeopathy-encyclopedia' ), array( 'status' => 422 ) ); }\n\t\t\telseif ( 'evidence' === $reason ) { $err = new WP_Error( 'he_future_claim_evidence_required', __( 'A claim cannot be approved without governed evidence.', 'homeopathy-encyclopedia' ), array( 'status' => 422 ) ); }\n\t\t\telseif ( in_array( $reason, array( 'version','decision' ), true ) ) { $err = new WP_Error( 'he_version_conflict', __( 'The claim state/version changed or the decision is invalid. Reload and retry.', 'homeopathy-encyclopedia' ), array( 'status' => 409 ) ); }\n\t\t\telse { HE_V2_Schema::record_runtime_failure( 'claim_review_atomic_failed', 'Claim review state and provenance could not be committed atomically.' ); $err = new WP_Error( 'he_future_claim_review_failed', __( 'The claim review and provenance could not be saved atomically.', 'homeopathy-encyclopedia' ), array( 'status' => 503 ) ); }\n\t\t\treturn self::mutation_finish( $reservation, $err, 200 );\n\t\t}\n\t\treturn self::mutation_finish( $reservation, array( 'claim_id' => $claim['public_id'], 'review_status' => $status, 'row_version' => $expected + 1 ), 200 );\n\t}\n"
          p.write_text(s[:a]+new+s[b:],encoding='utf-8')
          PY
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
          node --check homeopathy-encyclopedia/assets/js/encyclopedia-v2.js
          bash tests/run-all.sh 2>&1 | tee /tmp/r11.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/r11.log; then exit 1; fi
          git add homeopathy-encyclopedia/includes/class-he-v24-future-api.php
          git commit -m "fix(file-06): R11 make claim review provenance atomic"
          git push origin HEAD:audit/file-06-nineteenth-twenty-round-v2.4.18
