name: File 06 v2.4.18 R16 Source Correction
on:
  push:
    branches: [audit/file-06-nineteenth-twenty-round-v2.4.18]
    paths: [.github/workflows/file06-v2418-source-correction.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Fail closed when scope or reviewer assignment persistence fails
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 - <<'PY'
          from pathlib import Path
          gov=Path('homeopathy-encyclopedia/includes/class-he-v241-governance.php')
          s=gov.read_text(encoding='utf-8')
          old="\t\tupdate_user_meta( $user_id, self::META_EDITOR_TYPES, $types );\n\t\tHE_V2_Domain::emit_event( 'File06EditorScopeChanged.v1', 'user', $user_id, array( 'types' => $types, 'assigned_by' => get_current_user_id() ) );\n\t\treturn self::finish_mutation( $reservation, array( 'user_id' => $user_id, 'types' => $types, 'identity_authority' => 'file-00', 'content_scope_owner' => 'file-06' ) );"
          new="\t\t$previous_types = get_user_meta( $user_id, self::META_EDITOR_TYPES, true );\n\t\t$previous_types = is_array( $previous_types ) ? array_values( array_unique( array_map( 'sanitize_key', $previous_types ) ) ) : array();\n\t\t$compare_previous = $previous_types; $compare_new = $types; sort( $compare_previous ); sort( $compare_new );\n\t\tif ( $compare_previous !== $compare_new ) {\n\t\t\t$written = update_user_meta( $user_id, self::META_EDITOR_TYPES, $types );\n\t\t\tif ( false === $written ) { return self::finish_mutation( $reservation, new WP_Error( 'he_editor_scope_write_failed', __( 'The editor scope assignment could not be saved safely.', 'homeopathy-encyclopedia' ), array( 'status' => 503 ) ) ); }\n\t\t\tHE_V2_Domain::emit_event( 'File06EditorScopeChanged.v1', 'user', $user_id, array( 'types' => $types, 'assigned_by' => get_current_user_id() ) );\n\t\t}\n\t\treturn self::finish_mutation( $reservation, array( 'user_id' => $user_id, 'types' => $types, 'changed' => $compare_previous !== $compare_new, 'identity_authority' => 'file-00', 'content_scope_owner' => 'file-06' ) );"
          if s.count(old)!=1: raise SystemExit('R16 editor scope write baseline mismatch')
          s=s.replace(old,new,1)
          old2="\t\tupdate_post_meta( (int) $concept['post_id'], self::META_REVIEW_ASSIGNMENTS, $assignments );\n\t\tHE_V2_Domain::emit_event( 'File06ReviewerAssigned.v1', 'concept', (int) $concept['id'], array( 'scope' => $scope, 'reviewer_user_id' => $reviewer_id, 'assignment_version' => $assignments[ $scope ]['assignment_version'] ) );"
          new2="\t\t$written = update_post_meta( (int) $concept['post_id'], self::META_REVIEW_ASSIGNMENTS, $assignments );\n\t\tif ( false === $written ) { return self::finish_mutation( $reservation, new WP_Error( 'he_reviewer_assignment_write_failed', __( 'The reviewer assignment could not be saved safely.', 'homeopathy-encyclopedia' ), array( 'status' => 503 ) ) ); }\n\t\tHE_V2_Domain::emit_event( 'File06ReviewerAssigned.v1', 'concept', (int) $concept['id'], array( 'scope' => $scope, 'reviewer_user_id' => $reviewer_id, 'assignment_version' => $assignments[ $scope ]['assignment_version'] ) );"
          if s.count(old2)!=1: raise SystemExit('R16 entry reviewer write baseline mismatch')
          gov.write_text(s.replace(old2,new2,1),encoding='utf-8')

          rg=Path('homeopathy-encyclopedia/includes/class-he-v241-research-governance.php')
          r=rg.read_text(encoding='utf-8')
          old3="\t\tupdate_post_meta((int)$row['post_id'],HE_V241_Governance::META_REVIEW_ASSIGNMENTS,$assignments);\n\t\tHE_V2_Domain::emit_event('File06ResearchReviewerAssigned.v1','research',(int)$row['id'],array('scope'=>$scope,'reviewer_user_id'=>$reviewer,'assignment_version'=>$assignments[$scope]['assignment_version']));"
          new3="\t\t$written=update_post_meta((int)$row['post_id'],HE_V241_Governance::META_REVIEW_ASSIGNMENTS,$assignments);\n\t\tif(false===$written)return self::finish($res,new WP_Error('he_research_reviewer_assignment_write_failed',__('The research reviewer assignment could not be saved safely.','homeopathy-encyclopedia'),array('status'=>503)));\n\t\tHE_V2_Domain::emit_event('File06ResearchReviewerAssigned.v1','research',(int)$row['id'],array('scope'=>$scope,'reviewer_user_id'=>$reviewer,'assignment_version'=>$assignments[$scope]['assignment_version']));"
          if r.count(old3)!=1: raise SystemExit('R16 research reviewer write baseline mismatch')
          rg.write_text(r.replace(old3,new3,1),encoding='utf-8')
          PY
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
          node --check homeopathy-encyclopedia/assets/js/encyclopedia-v2.js
          bash tests/run-all.sh 2>&1 | tee /tmp/r16.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/r16.log; then exit 1; fi
          git add homeopathy-encyclopedia/includes/class-he-v241-governance.php homeopathy-encyclopedia/includes/class-he-v241-research-governance.php
          git commit -m "fix(file-06): R16 fail closed on assignment persistence errors"
          git push origin HEAD:audit/file-06-nineteenth-twenty-round-v2.4.18
