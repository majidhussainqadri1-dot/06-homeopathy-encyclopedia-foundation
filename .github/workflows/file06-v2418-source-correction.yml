name: File 06 v2.4.18 R7 Source Correction
on:
  push:
    branches: [audit/file-06-nineteenth-twenty-round-v2.4.18]
    paths: [.github/workflows/file06-v2418-source-correction.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Remove internal version row IDs and retest
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('homeopathy-encyclopedia/includes/class-he-v2-domain.php')
          s=p.read_text(encoding='utf-8')
          old="SELECT id,version_number,status,title,content_hash,change_reason,effective_at,created_at FROM "
          new="SELECT version_number,status,title,content_hash,change_reason,effective_at,created_at FROM "
          if s.count(old)!=1: raise SystemExit('R7 public versions SELECT baseline mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
          node --check homeopathy-encyclopedia/assets/js/encyclopedia-v2.js
          bash tests/run-all.sh 2>&1 | tee /tmp/r7.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/r7.log; then exit 1; fi
          git add homeopathy-encyclopedia/includes/class-he-v2-domain.php
          git commit -m "fix(file-06): R7 hide internal version row identifiers"
          git push origin HEAD:audit/file-06-nineteenth-twenty-round-v2.4.18
