      - name: Serialize editor and reviewer assignment updates
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 - <<'PY'
          from pathlib import Path
          gov=Path('homeopathy-encyclopedia/includes/class-he-v241-governance.php')
          s=gov.read_text(encoding='utf-8')
          a=s.find('\tpublic static function save_editor_scope( WP_REST_Request $request ) {')
