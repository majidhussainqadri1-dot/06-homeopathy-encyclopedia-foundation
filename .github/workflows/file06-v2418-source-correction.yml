name: File 06 v2.4.18 R13 Source Correction
on:
  push:
    branches: [audit/file-06-nineteenth-twenty-round-v2.4.18]
    paths: [.github/workflows/file06-v2418-source-correction.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Make translation review state and provenance atomic
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('homeopathy-encyclopedia/includes/class-he-v24-future-api.php')
          s=p.read_text(encoding='utf-8')
          a=s.find('\tpublic static function rest_translation_review( WP_REST_Request $request ) {')
          b=s.find('\n\tpublic static function rest_translation_publish(',a)
          if a<0 or b<0: raise SystemExit('R13 translation review method markers missing')
          new="\tpublic static function rest_translation_review( WP_REST_Request $request ) {\n\t\t$public = strtolower( sanitize_text_field( (string) $request['id'] ) ); $locale = HE_V242_Multilingual::canonical_locale( $request['locale'] );\n\t\t$reservation = self::mutation_guard( $request, 'future-translation-review-' . sanitize_key( $public . '-' . $locale ), HE_V2_Auth::CAP_REVIEW );\n\t\tif ( is_wp_error( $reservation ) || ! empty( $reservation['replay'] ) ) { return self::mutation_finish( $reservation, null, 200 ); }\n\t\tglobal $wpdb; $data = self::request_data( $request ); $concepts = HE_V2_Schema::table( 'concepts' );\n\t\tif ( false === $wpdb->query( 'START TRANSACTION' ) ) { return self::mutation_finish( $reservation, new WP_Error( 'he_future_translation_transaction_failed', __( 'The translation review could not start safely.', 'homeopathy-encyclopedia' ), array( 'status' => 503 ) ) ); }\n\t\ttry {\n\t\t\t$concept = $wpdb->get_row( $wpdb->prepare( \"SELECT id,public_id,current_version FROM {$concepts} WHERE public_id=%s FOR UPDATE\", $public ), ARRAY_A );\n\t\t\t$row = self::translation_row( $public, $locale, true );\n\t\t\tif ( ! $concept || ! $row ) { throw new RuntimeException( 'not-found' ); }\n\t\t\t$reviewer = get_current_user_id(); if ( (int) $row['translator_id'] === $reviewer && ! HE_V2_Auth::is_founder( $reviewer ) ) { throw new RuntimeException( 'self-review' ); }\n\t\t\t$expected = absint( $data['translation_version'] ?? 0 ); if ( ! $expected || $expected !== (int) $row['translation_version'] ) { throw new RuntimeException( 'version' ); }\n\t\t\tif ( (int) $row['source_version'] !== (int) $concept['current_version'] ) {\n\t\t\t\t$marked = $wpdb->query( $wpdb->prepare( \"UPDATE \" . HE_V24_Future_Schema::table( 'translations' ) . \" SET status='translation-outdated',updated_at=UTC_TIMESTAMP() WHERE id=%d AND translation_version=%d\", (int) $row['id'], $expected ) );\n\t\t\t\tif ( 1 !== (int) $marked ) { throw new RuntimeException( 'write' ); }\n\t\t\t\t$prov = HE_V24_Future_Schema::append_provenance( 'translation', $public . ':' . $locale, 'translation.outdated', '', array( 'translation_version' => $expected, 'source_version' => (int) $row['source_version'], 'current_source_version' => (int) $concept['current_version'] ) );\n\t\t\t\tif ( ! $prov || false === $wpdb->query( 'COMMIT' ) ) { throw new RuntimeException( 'commit' ); }\n\t\t\t\treturn self::mutation_finish( $reservation, new WP_Error( 'he_future_translation_outdated', __( 'The source knowledge changed; this translation must be refreshed before approval.', 'homeopathy-encyclopedia' ), array( 'status' => 409 ) ), 200 );\n\t\t\t}\n\t\t\t$decision = sanitize_key( $data['decision'] ?? '' ); if ( ! in_array( $decision, array( 'approved','changes-required','rejected' ), true ) ) { throw new RuntimeException( 'decision' ); }\n\t\t\t$status = 'approved' === $decision ? 'approved' : ( 'rejected' === $decision ? 'rejected' : 'draft' );\n\t\t\t$changed = $wpdb->query( $wpdb->prepare( \"UPDATE \" . HE_V24_Future_Schema::table( 'translations' ) . \" SET status=%s,reviewer_id=%d,updated_at=UTC_TIMESTAMP() WHERE id=%d AND translation_version=%d AND status='draft'\", $status, $reviewer, (int) $row['id'], $expected ) );\n\t\t\tif ( 1 !== (int) $changed ) { throw new RuntimeException( 'version' ); }\n\t\t\t$prov = HE_V24_Future_Schema::append_provenance( 'translation', $public . ':' . $locale, 'translation.reviewed', '', array( 'decision' => $decision, 'translation_version' => $expected ) );\n\t\t\tif ( ! $prov || false === $wpdb->query( 'COMMIT' ) ) { throw new RuntimeException( 'commit' ); }\n\t\t} catch ( Throwable $error ) {\n\t\t\t$wpdb->query( 'ROLLBACK' ); $reason = $error->getMessage();\n\t\t\tif ( 'not-found' === $reason ) { $err = new WP_Error( 'he_not_found', __( 'Translation not found.', 'homeopathy-encyclopedia' ), array( 'status' => 404 ) ); }\n\t\t\telseif ( 'self-review' === $reason ) { $err = new WP_Error( 'he_independent_review_required', __( 'The translator cannot provide the independent approval review.', 'homeopathy-encyclopedia' ), array( 'status' => 422 ) ); }\n\t\t\telseif ( in_array( $reason, array( 'version','decision' ), true ) ) { $err = new WP_Error( 'he_version_conflict', __( 'The translation state/version changed or the decision is invalid. Reload and retry.', 'homeopathy-encyclopedia' ), array( 'status' => 409 ) ); }\n\t\t\telse { HE_V2_Schema::record_runtime_failure( 'translation_review_atomic_failed', 'Translation review state and provenance could not be committed atomically.' ); $err = new WP_Error( 'he_future_translation_review_failed', __( 'The translation review and provenance could not be saved atomically.', 'homeopathy-encyclopedia' ), array( 'status' => 503 ) ); }\n\t\t\treturn self::mutation_finish( $reservation, $err, 200 );\n\t\t}\n\t\treturn self::mutation_finish( $reservation, array( 'status' => $status, 'translation_version' => $expected, 'concept_id' => $public, 'locale' => $locale ), 200 );\n\t}\n"
          p.write_text(s[:a]+new+s[b:],encoding='utf-8')
          PY
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
          node --check homeopathy-encyclopedia/assets/js/encyclopedia-v2.js
          bash tests/run-all.sh 2>&1 | tee /tmp/r13.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/r13.log; then exit 1; fi
          git add homeopathy-encyclopedia/includes/class-he-v24-future-api.php
          git commit -m "fix(file-06): R13 make translation review provenance atomic"
          git push origin HEAD:audit/file-06-nineteenth-twenty-round-v2.4.18
