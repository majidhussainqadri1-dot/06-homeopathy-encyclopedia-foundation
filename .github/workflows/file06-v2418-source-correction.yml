name: File 06 v2.4.18 R19 Alignment
on:
  push:
    branches: [audit/file-06-nineteenth-twenty-round-v2.4.18]
    paths: [.github/workflows/file06-v2418-source-correction.yml]
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Align R19 candidate truth and run inherited QA
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 scripts/v2418-r19-align.py
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
          node --check homeopathy-encyclopedia/assets/js/encyclopedia-v2.js
          bash tests/run-all.sh 2>&1 | tee /tmp/r19.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/r19.log; then
            echo 'Unexpected warning/error in R19 inherited QA' >&2
            exit 1
          fi
          git add homeopathy-encyclopedia/homeopathy-encyclopedia.php homeopathy-encyclopedia/readme.txt README.md STATUS.md CHANGELOG.md SBOM.json docs/FILE-06-v2.4.18-NINETEENTH-TWENTY-ROUND-REVIEW.md tests/v2417-eighteenth-twenty-round-regressions.php tests/v2418-nineteenth-twenty-round-regressions.php tests/run-all.sh
          git commit -m "fix(file-06): R19 align v2.4.18 candidate truth"
          git push origin HEAD:audit/file-06-nineteenth-twenty-round-v2.4.18
# retriggered after current-candidate invariant widening
