name: File 06 v2.4.18 R15 Source Correction
on:
  push:
    branches: [audit/file-06-nineteenth-twenty-round-v2.4.18]
    paths: [.github/workflows/file06-v2418-source-correction.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Make concept and researcher mappings provenance-atomic
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('homeopathy-encyclopedia/includes/class-he-v24-future-api.php')
          s=p.read_text(encoding='utf-8')
          a=s.find('\tpublic static function rest_mapping( WP_REST_Request $request ) {')
          b=s.find('\n\tpublic static function rest_researcher_identity(',a)
          c=s.find('\n\tprivate static function tokens(',b)
          if min(a,b,c)<0: raise SystemExit('R15 mapping method markers missing')
          mapping="\tpublic static function rest_mapping( WP_REST_Request $request ) {\n\t\t$reservation = self::mutation_guard( $request, 'future-vocabulary-map', HE_V2_Auth::CAP_REVIEW );\n\t\tif ( is_wp_error( $reservation ) || ! empty( $reservation['replay'] ) ) { return self::mutation_finish( $reservation, null, 200 ); }\n\t\tglobal $wpdb; $data = self::request_data( $request ); $vocabulary = sanitize_key( $data['vocabulary'] ?? '' );\n\t\tif ( ! in_array( $vocabulary, array( 'mesh','datacite','pubmed','clinicaltrials' ), true ) ) { return self::mutation_finish( $reservation, new WP_Error( 'he_future_mapping_invalid', __( 'Unsupported concept-mapping vocabulary. ORCID is a researcher identity mapping, not a concept taxonomy.', 'homeopathy-encyclopedia' ), array( 'status' => 400 ) ) ); }\n\t\t$concept = self::concept_by_public_id( $data['concept_id'] ?? '', false ); if ( ! $concept ) { return self::mutation_finish( $reservation, new WP_Error( 'he_not_found', __( 'Concept not found.', 'homeopathy-encyclopedia' ), array( 'status' => 404 ) ) ); }\n\t\t$external = HE_V24_Future_Schema::validate_external_id( $vocabulary, $data['external_id'] ?? '' ); if ( ! $external ) { return self::mutation_finish( $reservation, new WP_Error( 'he_future_mapping_identifier_invalid', __( 'The external vocabulary identifier is invalid.', 'homeopathy-encyclopedia' ), array( 'status' => 400 ) ) ); }\n\t\t$table = HE_V24_Future_Schema::table( 'concept_mappings' ); $concepts = HE_V2_Schema::table( 'concepts' );\n\t\tif ( false === $wpdb->query( 'START TRANSACTION' ) ) { return self::mutation_finish( $reservation, new WP_Error( 'he_future_mapping_write_failed', __( 'The vocabulary mapping transaction could not start safely.', 'homeopathy-encyclopedia' ), array( 'status' => 503 ) ) ); }\n\t\ttry {\n\t\t\t$locked = $wpdb->get_row( $wpdb->prepare( \"SELECT id,public_id FROM {$concepts} WHERE id=%d FOR UPDATE\", (int) $concept['id'] ), ARRAY_A ); if ( ! $locked ) { throw new RuntimeException( 'not-found' ); }\n\t\t\t$existing = $wpdb->get_row( $wpdb->prepare( \"SELECT id,created_at FROM {$table} WHERE concept_id=%d AND vocabulary=%s AND external_id=%s FOR UPDATE\", $locked['id'], $vocabulary, $external ), ARRAY_A ); $now = current_time( 'mysql', true );\n\t\t\t$row = array( 'concept_id' => $locked['id'], 'vocabulary' => $vocabulary, 'external_id' => $external, 'preferred_label' => sanitize_text_field( $data['preferred_label'] ?? '' ), 'mapping_state' => 'reviewed', 'reviewed_by' => get_current_user_id(), 'created_at' => $existing ? $existing['created_at'] : $now, 'updated_at' => $now );\n\t\t\t$ok = $existing ? $wpdb->update( $table, $row, array( 'id' => (int) $existing['id'] ) ) : $wpdb->insert( $table, $row ); if ( false === $ok ) { throw new RuntimeException( 'write' ); }\n\t\t\t$prov = HE_V24_Future_Schema::append_provenance( 'concept', (string) $locked['id'], 'mapping.reviewed', '', array( 'vocabulary' => $vocabulary, 'external_id' => $external ) ); if ( ! $prov || false === $wpdb->query( 'COMMIT' ) ) { throw new RuntimeException( 'commit' ); }\n\t\t} catch ( Throwable $error ) { $wpdb->query( 'ROLLBACK' ); if ( 'not-found' === $error->getMessage() ) { $err = new WP_Error( 'he_not_found', __( 'Concept not found.', 'homeopathy-encyclopedia' ), array( 'status' => 404 ) ); } else { HE_V2_Schema::record_runtime_failure( 'concept_mapping_atomic_failed', 'Concept mapping and provenance could not be committed atomically.' ); $err = new WP_Error( 'he_future_mapping_write_failed', __( 'The vocabulary mapping and provenance could not be saved atomically.', 'homeopathy-encyclopedia' ), array( 'status' => 503 ) ); } return self::mutation_finish( $reservation, $err ); }\n\t\treturn self::mutation_finish( $reservation, array( 'saved' => true, 'concept_id' => $locked['public_id'], 'vocabulary' => $vocabulary, 'external_id' => $external ), 200 );\n\t}\n"
          identity="\tpublic static function rest_researcher_identity( WP_REST_Request $request ) {\n\t\t$reservation = self::mutation_guard( $request, 'future-researcher-identity', HE_V2_Auth::CAP_REVIEW );\n\t\tif ( is_wp_error( $reservation ) || ! empty( $reservation['replay'] ) ) { return self::mutation_finish( $reservation, null, 200 ); }\n\t\tglobal $wpdb; $data = self::request_data( $request ); $user_id = absint( $data['user_id'] ?? 0 ); $orcid = HE_V24_Future_Schema::validate_external_id( 'orcid', $data['external_id'] ?? '' );\n\t\tif ( ! $user_id || ! $orcid || ! HE_V2_Auth::provider_ready() || ! HE_V2_Auth::membership_allowed( $user_id ) ) { return self::mutation_finish( $reservation, new WP_Error( 'he_future_researcher_identity_invalid', __( 'A valid, active File 00 identity and ORCID iD are required.', 'homeopathy-encyclopedia' ), array( 'status' => 422 ) ) ); }\n\t\t$table = HE_V24_Future_Schema::table( 'researcher_ids' ); if ( false === $wpdb->query( 'START TRANSACTION' ) ) { return self::mutation_finish( $reservation, new WP_Error( 'he_future_researcher_identity_write_failed', __( 'The researcher identity transaction could not start safely.', 'homeopathy-encyclopedia' ), array( 'status' => 503 ) ) ); }\n\t\ttry {\n\t\t\t$owner = (int) $wpdb->get_var( $wpdb->prepare( \"SELECT user_id FROM {$table} WHERE provider='orcid' AND external_id=%s FOR UPDATE\", $orcid ) ); if ( $owner && $owner !== $user_id ) { throw new RuntimeException( 'conflict' ); }\n\t\t\t$existing = $wpdb->get_row( $wpdb->prepare( \"SELECT id,created_at FROM {$table} WHERE user_id=%d AND provider='orcid' FOR UPDATE\", $user_id ), ARRAY_A ); $now = current_time( 'mysql', true );\n\t\t\t$row = array( 'user_id' => $user_id, 'provider' => 'orcid', 'external_id' => $orcid, 'preferred_label' => sanitize_text_field( $data['preferred_label'] ?? '' ), 'mapping_state' => 'reviewed', 'reviewed_by' => get_current_user_id(), 'created_at' => $existing ? $existing['created_at'] : $now, 'updated_at' => $now );\n\t\t\t$ok = $existing ? $wpdb->update( $table, $row, array( 'id' => (int) $existing['id'] ) ) : $wpdb->insert( $table, $row ); if ( false === $ok ) { throw new RuntimeException( 'write' ); }\n\t\t\t$prov = HE_V24_Future_Schema::append_provenance( 'researcher-identity', $orcid, 'orcid.mapping.reviewed', '', array( 'mapping_only' => true, 'user_id' => $user_id ) ); if ( ! $prov || false === $wpdb->query( 'COMMIT' ) ) { throw new RuntimeException( 'commit' ); }\n\t\t} catch ( Throwable $error ) {\n\t\t\t$wpdb->query( 'ROLLBACK' ); if ( 'conflict' === $error->getMessage() ) { $err = new WP_Error( 'he_future_orcid_conflict', __( 'This ORCID iD is already mapped to another governed identity.', 'homeopathy-encyclopedia' ), array( 'status' => 409 ) ); } else { $race_owner = (int) $wpdb->get_var( $wpdb->prepare( \"SELECT user_id FROM {$table} WHERE provider='orcid' AND external_id=%s\", $orcid ) ); if ( $race_owner && $race_owner !== $user_id ) { $err = new WP_Error( 'he_future_orcid_conflict', __( 'This ORCID iD is already mapped to another governed identity.', 'homeopathy-encyclopedia' ), array( 'status' => 409 ) ); } else { HE_V2_Schema::record_runtime_failure( 'researcher_identity_atomic_failed', 'Researcher identity mapping and provenance could not be committed atomically.' ); $err = new WP_Error( 'he_future_researcher_identity_write_failed', __( 'The researcher identity mapping and provenance could not be saved atomically.', 'homeopathy-encyclopedia' ), array( 'status' => 503 ) ); } } return self::mutation_finish( $reservation, $err );\n\t\t}\n\t\treturn self::mutation_finish( $reservation, array( 'saved' => true, 'provider' => 'orcid', 'external_id' => $orcid, 'mapping_only' => true, 'grants_platform_privilege' => false ), 200 );\n\t}\n"
          p.write_text(s[:a]+mapping+'\n'+identity+s[c:],encoding='utf-8')
          PY
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
          node --check homeopathy-encyclopedia/assets/js/encyclopedia-v2.js
          bash tests/run-all.sh 2>&1 | tee /tmp/r15.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/r15.log; then exit 1; fi
          git add homeopathy-encyclopedia/includes/class-he-v24-future-api.php
          git commit -m "fix(file-06): R15 make scholarly mappings provenance atomic"
          git push origin HEAD:audit/file-06-nineteenth-twenty-round-v2.4.18
