name: File 06 v2.4.8 Ninth Ten-Round Final QA v2
on:
  push:
    branches: [audit/file-06-ninth-ten-round-v2.4.8]
    paths: [.github/workflows/file06-v248-ninth-ten-round-final-v2.yml]
permissions:
  contents: read
jobs:
  php-syntax:
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)

  aggregate-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Run complete inherited and ninth ten-round aggregate gate
        run: |
          set -euo pipefail
          bash tests/run-all.sh 2>&1 | tee /tmp/file06-aggregate.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/file06-aggregate.log; then
            echo 'Unexpected warning/error emitted by File 06 aggregate QA' >&2
            exit 1
          fi
          grep -q 'File 06 v2.4.8 ninth-review regressions: PASS' /tmp/file06-aggregate.log
          grep -q 'All File 06 v2.4.8 automated checks' /tmp/file06-aggregate.log
          ! grep -R -F '@@session.in_transaction' homeopathy-encyclopedia/includes/class-he-v2-domain.php

  transaction-callsite-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Confirm internal event emission remains outside owning transaction blocks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[]
          for p in Path('homeopathy-encyclopedia').rglob('*.php'):
              s=p.read_text()
              if 'START TRANSACTION' in s:
                  files.append((p,s))
          for p,s in files:
              pos=0
              while True:
                  a=s.find("START TRANSACTION",pos)
                  if a<0: break
                  c=s.find("COMMIT",a)
                  if c<0: raise SystemExit(f'{p}: transaction has no later COMMIT marker')
                  segment=s[a:c]
                  if 'emit_event(' in segment:
                      raise SystemExit(f'{p}: emit_event occurs before owning COMMIT')
                  pos=c+6
          print('transaction-callsite-audit-ok')
          PY

  reproducible-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build candidate twice and report exact digests
        run: |
          set -euo pipefail
          a=/tmp/06-homeopathy-encyclopedia-foundation-2.4.8-a.zip
          b=/tmp/06-homeopathy-encyclopedia-foundation-2.4.8-b.zip
          python3 scripts/build-release.py --source homeopathy-encyclopedia --output "$a"
          python3 scripts/build-release.py --source homeopathy-encyclopedia --output "$b"
          cmp -s "$a" "$b"
          echo "PACKAGE_SHA256=$(sha256sum "$a" | awk '{print $1}')"
          echo "PACKAGE_BYTES=$(stat -c '%s' "$a")"
          echo "SOURCE_TREE_SHA256=$(python3 scripts/source-tree-hash.py homeopathy-encyclopedia | tail -n1 | tr -d '[:space:]')"
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          path=Path('/tmp/06-homeopathy-encyclopedia-foundation-2.4.8-a.zip')
          with zipfile.ZipFile(path) as z:
              names=z.namelist()
              assert names and all(n.startswith('06-homeopathy-encyclopedia-foundation/') for n in names)
              bootstrap=z.read('06-homeopathy-encyclopedia-foundation/homeopathy-encyclopedia.php').decode('utf-8')
              assert ' * Version: 2.4.8' in bootstrap
              assert "define( 'HE_VERSION', '2.4.8' )" in bootstrap
              assert "define( 'HE_SCHEMA_VERSION', 10 )" in bootstrap
              assert "define( 'HE_CONTRACT_VERSION', '2.4.8' )" in bootstrap
              assert "'future_hardening_version'=>'2.4.8'" in bootstrap
          PY

  wordpress-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Install WP-CLI
        run: |
          curl -fsSLo /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar --info
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
      - name: WordPress 7.0.1 lifecycle smoke with strict runtime-log gate
        run: |
          set -euo pipefail
          fail_on_runtime_noise() {
            local log="$1"
            if grep -Eiq 'WordPress database error|PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' "$log"; then
              echo 'File 06 emitted a database/runtime warning or error:' >&2
              cat "$log" >&2
              exit 1
            fi
          }
          run_clean() {
            local log
            log="$(mktemp)"
            "$@" >"$log" 2>&1
            cat "$log"
            fail_on_runtime_noise "$log"
            rm -f "$log"
          }
          mkdir -p /tmp/wp
          cd /tmp/wp
          wp core download --version=7.0.1 --force
          wp config create --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          wp core install --url=http://file06.test --title='File 06 CI' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          cp -R "$GITHUB_WORKSPACE/homeopathy-encyclopedia" wp-content/plugins/homeopathy-encyclopedia
          run_clean wp plugin activate homeopathy-encyclopedia
          run_clean wp eval 'if ( HE_VERSION !== "2.4.8" || HE_SCHEMA_VERSION !== 10 || HE_CONTRACT_VERSION !== "2.4.8" ) { throw new Exception("File 06 runtime contract mismatch"); } echo "runtime-contract-ok\n";'
          run_clean wp eval 'if ( HE_V24_Future_Schema::VERSION !== 2 || (int)get_option(HE_V24_Future_Schema::OPTION_VERSION,0)!==2 ) { throw new Exception("future schema option/version mismatch"); } if (!HE_V24_Migration_Safety::ready()) { throw new Exception("future migration not ready after fresh activation"); } echo "future-migration-ready\n";'
          run_clean wp eval 'global $wpdb; foreach(array("claims","claim_evidence","provenance","external_records","concept_mappings","similarity","researcher_ids","freshness","impact_queue","research_gaps","watchlists","translations") as $name){$t=HE_V24_Future_Schema::table($name); if($t!==$wpdb->get_var($wpdb->prepare("SHOW TABLES LIKE %s",$t))){throw new Exception("missing future table ".$name);}} echo "future-schema-tables-ok\n";'
          run_clean wp eval 'wp_set_current_user(1); do_action("rest_api_init"); $r=rest_do_request(new WP_REST_Request("GET","/sabri/v2/file-06/health")); if($r->get_status()!==503){throw new Exception("health route did not fail closed without File00 provider: ".$r->get_status());} echo "health-file00-failclosed-ok\n";'
          run_clean wp eval '$a=HE_V2_Domain::idempotent_begin(1,"ci-v248","ci-key-12345678",array("x"=>1)); if(is_wp_error($a)||!empty($a["replay"])||empty($a["id"])){throw new Exception("idempotency reserve failed");} if(!HE_V2_Domain::idempotent_finish($a["id"],200,array("ok"=>1))){throw new Exception("idempotency finish failed");} $b=HE_V2_Domain::idempotent_begin(1,"ci-v248","ci-key-12345678",array("x"=>1)); if(is_wp_error($b)||empty($b["replay"])||(int)$b["code"]!==200){throw new Exception("idempotency replay failed");} echo "v248-idempotency-ok\n";'
          run_clean wp eval 'if(!HE_V2_Domain::rate_allow("ci-v248-rate",2,60)){throw new Exception("rate limiter first hit failed");} if(!HE_V2_Domain::rate_allow("ci-v248-rate",2,60)){throw new Exception("rate limiter second hit failed");} if(HE_V2_Domain::rate_allow("ci-v248-rate",2,60)){throw new Exception("rate limiter did not enforce limit");} echo "v248-rate-limit-ok\n";'
          run_clean wp eval '$e=HE_V2_Domain::emit_event("File06CISmoke.v1","concept",0,array("ci"=>true)); global $wpdb; $ev=(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM ".HE_V2_Schema::table("events")." WHERE event_id=%s",$e["event_id"])); $ob=(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM ".HE_V2_Schema::table("outbox")." WHERE event_id=%s",$e["event_id"])); if($ev!==1||$ob!==1){throw new Exception("event/outbox pair missing");} HE_V2_Integrations::process_outbox(10); $status=$wpdb->get_var($wpdb->prepare("SELECT status FROM ".HE_V2_Schema::table("outbox")." WHERE event_id=%s",$e["event_id"])); if($status!=="delivered"){throw new Exception("outbox CAS delivery failed: ".$status);} echo "v248-event-outbox-ok\n";'
          run_clean wp eval 'if(!method_exists("HE_V22_Public_Guard","research_public_query_where") || !has_filter("posts_where",array("HE_V22_Public_Guard","research_public_query_where"))){throw new Exception("research query eligibility guard missing");} echo "v248-research-query-guard-ok\n";'
          run_clean wp eval 'wp_set_current_user(1); if(HE_V2_Auth::provider_ready()){throw new Exception("File00 unexpectedly present");} HE_V22_Governance::resume_background_work(); echo "v248-maintenance-failclosed-ok\n";'
          run_clean wp plugin deactivate homeopathy-encyclopedia
          run_clean wp plugin activate homeopathy-encyclopedia
          run_clean wp eval 'if ((int)get_option(HE_V2_Schema::OPTION_SCHEMA,0)!==10){throw new Exception("schema option mismatch");} if ((int)get_option(HE_V24_Future_Schema::OPTION_VERSION,0)!==2){throw new Exception("future schema option mismatch after reactivation");} if (!HE_V24_Migration_Safety::ready()){throw new Exception("future migration not ready after reactivation");} echo "reactivation-ok\n";'
