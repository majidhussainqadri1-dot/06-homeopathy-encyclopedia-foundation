name: File 06 v2.4.4 Ten-Round Review Round 4 Fix
on:
  push:
    branches:
      - audit/file-06-fifth-ten-round-v2.4.4
    paths:
      - .github/workflows/file06-v244-round4-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply round-4 correction
        run: python3 scripts/v244-ten-round-round4.py
      - name: Validate correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          php -l homeopathy-encyclopedia/includes/class-he-v2-admin.php
          grep -q "Original source language box" homeopathy-encyclopedia/includes/class-he-v2-admin.php
          grep -q "HE_V242_Language_Surfaces::NONCE_FIELD" homeopathy-encyclopedia/includes/class-he-v2-admin.php
          bash tests/run-all.sh
      - name: Commit corrected owning source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add homeopathy-encyclopedia/includes/class-he-v2-admin.php
          git commit -m 'fix(file-06): preserve canonical source language on admin saves'
          git push origin HEAD:audit/file-06-fifth-ten-round-v2.4.4
