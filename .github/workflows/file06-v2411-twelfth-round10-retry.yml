name: File 06 v2.4.11 Twelfth Review Round 10 Retry
on:
  push:
    branches: [audit/file-06-twelfth-ten-round-v2.4.11]
    paths: [.github/workflows/file06-v2411-twelfth-round10-retry.yml]
permissions:
  contents: write
jobs:
  round10:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply reviewed Round 10 correction, full retest, commit and push
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 scripts/v2411-twelfth-ten-round-fixes.py 10
          V2411_ROUND=10 php tests/v2411-twelfth-ten-round-regressions.php
          bash tests/run-all.sh 2>&1 | tee /tmp/v2411-round10.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/v2411-round10.log; then
            echo 'Unexpected PHP warning/error in Round 10' >&2
            exit 1
          fi
          git add -A
          git diff --cached --quiet && { echo 'Round 10 produced no correction' >&2; exit 1; }
          git commit -m "fix(file-06): twelfth review round 10 correction"
          git push origin HEAD:audit/file-06-twelfth-ten-round-v2.4.11
