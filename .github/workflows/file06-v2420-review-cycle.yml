name: File 06 v2.4.20 Review Cycle QA

on:
  push:
    branches:
      - audit/file-06-twenty-first-twenty-round-v2.4.20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-cycle-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Freeze exact HEAD
        run: |
          set -euo pipefail
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
      - name: PHP and JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find homeopathy-encyclopedia -type f -name '*.js' -print0 | sort -z)
      - name: Full File 06 regression
        run: |
          set -euo pipefail
          bash tests/run-all.sh
