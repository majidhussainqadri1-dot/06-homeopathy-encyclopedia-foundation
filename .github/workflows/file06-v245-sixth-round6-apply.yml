name: File 06 v2.4.5 Sixth Review Round 6 Apply
on:
  push:
    branches:
      - audit/file-06-sixth-ten-round-v2.4.5
    paths:
      - '.github/workflows/file06-v245-sixth-round6-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/file-06-sixth-ten-round-v2.4.5
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Remove obsolete outer Future maintenance lease owner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('homeopathy-encyclopedia/includes/class-he-v241-governance.php')
          s=p.read_text()
          s=s.replace("\tconst LEASE_OPTION = 'he_v241_future_maintenance_lease';\n\tconst LEASE_TTL = 15 * MINUTE_IN_SECONDS;\n", '')
          old="""\n\t\t/* Replace the unleased Future worker with one serialized owner worker. */
\t\tremove_action( HE_V24_Future_Schema::CRON, array( 'HE_V24_Future_Schema', 'maintenance' ) );
\t\tadd_action( HE_V24_Future_Schema::CRON, array( __CLASS__, 'maintenance_serialized' ) );"""
          new="""\n\t\t/* HE_V24_Future_Schema is the canonical Future worker and now serializes its own maintenance execution. */"""
          if old not in s: raise SystemExit('outer maintenance hook block missing')
          s=s.replace(old,new,1)
          pattern=r"\n\tpublic static function maintenance_serialized\(\) \{.*?\n\t\}\n\}"
          s2,n=re.subn(pattern,"\n}",s,count=1,flags=re.S)
          if n != 1: raise SystemExit('outer maintenance method removal failed')
          p.write_text(s2)

          t=Path('tests/test-file06-v245-sixth-ten-round-regressions.php')
          x=t.read_text(); needle='echo "File 06 v2.4.5 sixth-review regressions: PASS\\n";'
          add="""$gov = file_get_contents(__DIR__ . '/../homeopathy-encyclopedia/includes/class-he-v241-governance.php');
          f06_v245_assert(strpos($gov, 'maintenance_serialized') === false, 'Round 6 obsolete outer Future maintenance lease remains');
          f06_v245_assert(strpos($gov, 'he_v241_future_maintenance_lease') === false, 'Round 6 split Future maintenance lease ownership remains');
          f06_v245_assert(strpos($schema, 'add_action( self::CRON, array( __CLASS__, \'maintenance\' ) )') !== false, 'Round 6 canonical V24 maintenance hook missing');
          """+needle
          if 'Round 6 obsolete outer Future maintenance lease remains' not in x:
              if needle not in x: raise SystemExit('test marker missing')
              x=x.replace(needle,add,1)
          t.write_text(x)
          PY
      - name: Validate Round 6 correction
        run: |
          set -euo pipefail
          php -l homeopathy-encyclopedia/includes/class-he-v241-governance.php
          php tests/test-file06-v245-sixth-ten-round-regressions.php
          git diff --check
      - name: Commit Round 6 correction
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add homeopathy-encyclopedia/includes/class-he-v241-governance.php tests/test-file06-v245-sixth-ten-round-regressions.php
          git commit -m 'fix(file-06): make V24 the sole Future maintenance owner'
          git push origin HEAD:audit/file-06-sixth-ten-round-v2.4.5
