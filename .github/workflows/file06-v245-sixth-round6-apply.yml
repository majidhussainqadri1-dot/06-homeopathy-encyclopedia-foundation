name: File 06 v2.4.5 Sixth Review Round 6 Apply
on:
  push:
    branches:
      - audit/file-06-sixth-ten-round-v2.4.5
    paths:
      - .github/workflows/file06-v245-sixth-round6-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/file-06-sixth-ten-round-v2.4.5
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply maintenance ownership correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('homeopathy-encyclopedia/includes/class-he-v241-governance.php')
          s = p.read_text()
          s = s.replace("\tconst LEASE_OPTION = 'he_v241_future_maintenance_lease';\n\tconst LEASE_TTL = 15 * MINUTE_IN_SECONDS;\n", '')
          old = "\n\t\t/* Replace the unleased Future worker with one serialized owner worker. */\n\t\tremove_action( HE_V24_Future_Schema::CRON, array( 'HE_V24_Future_Schema', 'maintenance' ) );\n\t\tadd_action( HE_V24_Future_Schema::CRON, array( __CLASS__, 'maintenance_serialized' ) );"
          new = "\n\t\t/* V24 Future Schema is the sole maintenance owner and serializes itself. */"
          if old not in s:
              raise SystemExit('outer maintenance hook block missing')
          s = s.replace(old, new, 1)
          pattern = r"\n\tpublic static function maintenance_serialized\(\) \{.*?\n\t\}\n\}"
          s, count = re.subn(pattern, "\n}", s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('outer maintenance method removal failed')
          p.write_text(s)

          t = Path('tests/test-file06-v245-sixth-ten-round-regressions.php')
          x = t.read_text()
          needle = 'echo "File 06 v2.4.5 sixth-review regressions: PASS\\n";'
          block = "$gov = file_get_contents(__DIR__ . '/../homeopathy-encyclopedia/includes/class-he-v241-governance.php');\n"
          block += "f06_v245_assert(strpos($gov, 'maintenance_serialized') === false, 'Round 6 obsolete outer Future maintenance lease remains');\n"
          block += "f06_v245_assert(strpos($gov, 'he_v241_future_maintenance_lease') === false, 'Round 6 split Future maintenance lease ownership remains');\n"
          if 'Round 6 obsolete outer Future maintenance lease remains' not in x:
              if needle not in x:
                  raise SystemExit('test marker missing')
              x = x.replace(needle, block + needle, 1)
          t.write_text(x)
          PY
          php -l homeopathy-encyclopedia/includes/class-he-v241-governance.php
          php tests/test-file06-v245-sixth-ten-round-regressions.php
          git diff --check
      - name: Commit Round 6 correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name majidhussainqadri1-dot
          git config user.email majidhussainqadri1@gmail.com
          git add homeopathy-encyclopedia/includes/class-he-v241-governance.php tests/test-file06-v245-sixth-ten-round-regressions.php
          git commit -m 'fix(file-06): make V24 the sole Future maintenance owner'
          git push origin HEAD:audit/file-06-sixth-ten-round-v2.4.5
