name: File 06 v2.4.12 Thirteenth Ten-Round Final QA
on:
  push:
    branches: [audit/file-06-thirteenth-ten-round-v2.4.12]
    paths: [.github/workflows/file06-v2412-thirteenth-ten-round-final.yml]
permissions:
  contents: read
jobs:
  php-syntax:
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)

  aggregate-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Run complete inherited and thirteenth ten-round aggregate gate
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '(^|/)(__pycache__/|.*\.pyc$)'; then
            echo 'Tracked Python cache artifact found in repository' >&2
            exit 1
          fi
          bash tests/run-all.sh 2>&1 | tee /tmp/file06-aggregate.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/file06-aggregate.log; then
            echo 'Unexpected warning/error emitted by File 06 aggregate QA' >&2
            exit 1
          fi
          grep -q 'File 06 v2.4.12 thirteenth-review regressions through R10: PASS' /tmp/file06-aggregate.log
          grep -q 'All File 06 v2.4.12 automated checks' /tmp/file06-aggregate.log
          ! grep -R -F '@@session.in_transaction' homeopathy-encyclopedia

  thirteenth-cycle-source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Confirm corrected thirteenth-cycle contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          inc=Path('homeopathy-encyclopedia/includes')
          domain=(inc/'class-he-v2-domain.php').read_text()
          schedule=(inc/'class-he-v22-schedule.php').read_text()
          gov=(inc/'class-he-v22-governance.php').read_text()
          lang=(inc/'class-he-v242-language-surfaces.php').read_text()
          integ=(inc/'class-he-v2-integrations.php').read_text()
          authoring=(inc/'class-he-v242-research-authoring.php').read_text()
          third=(inc/'class-he-v242-third-audit.php').read_text()
          public=(inc/'class-he-v22-public-guard.php').read_text()
          bootstrap=Path('homeopathy-encyclopedia/homeopathy-encyclopedia.php').read_text()
          readme=Path('homeopathy-encyclopedia/readme.txt').read_text()
          runall=Path('tests/run-all.sh').read_text()
          checks=[
            ('R1 recursive structured DTO','private static function public_structured_value',domain),
            ('R1 recursive value walk','self::public_structured_value( $item, $depth + 1 )',domain),
            ('R2 invalidation CAS','$invalidated_row = $wpdb->query',schedule),
            ('R2 invalidation event','validation-failed-before-publication',schedule),
            ('R3 merge transaction start','secure_merge_transaction_start_failed',gov),
            ('R3 merge commit certainty','secure_merge_commit_failed',gov),
            ('R4 alias persistence certainty','merge-alias-write-failed',gov),
            ('R4 index persistence certainty','merge-index-write-failed',gov),
            ('R5 language convergence','source_language_persistence_failed',lang),
            ('R5 language CAS','source_language_domain_cas_failed',lang),
            ('R6 event minimizer','public static function minimize_event_payload',domain),
            ('R6 consumed event minimizer','HE_V2_Domain::minimize_event_payload',integ),
            ('R7 safe text list','public static function sanitize_text_list',domain),
            ('R7 authoring nested shape','HE_V2_Domain::sanitize_text_list( $value )',authoring),
            ('R7 early governance nested shape','HE_V2_Domain::sanitize_text_list',third),
            ('R8 canonical posts results filter',"add_filter( 'posts_results', array( __CLASS__, 'research_public_query_results' )",public),
            ('R8 canonical public row check','self::is_public_row( $row )',public),
            ('R9 merge cycle stack','private static $merge_resolution_stack',domain),
            ('R9 merge cycle failure','concept_merge_cycle_detected',domain),
            ('R10 runtime','Version: 2.4.12',bootstrap),
            ('R10 contract',"HE_CONTRACT_VERSION', '2.4.12",bootstrap),
            ('R10 future hardening',"'future_hardening_version'=>'2.4.12'",bootstrap),
            ('R10 stable tag','Stable tag: 2.4.12',readme),
            ('R10 aggregate wiring','v2412-thirteenth-ten-round-regressions.php',runall),
          ]
          for label,marker,text in checks:
              if marker not in text: raise SystemExit(f'{label} marker missing: {marker}')
          print('v2412-thirteenth-cycle-source-contract-ok')
          PY

  transaction-callsite-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Confirm event emission remains outside owning transactions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('homeopathy-encyclopedia').rglob('*.php'):
              s=p.read_text(); pos=0
              while True:
                  a=s.find('START TRANSACTION',pos)
                  if a<0: break
                  c=s.find('COMMIT',a)
                  if c<0: raise SystemExit(f'{p}: transaction has no later COMMIT marker')
                  if 'emit_event(' in s[a:c]: raise SystemExit(f'{p}: emit_event occurs before owning COMMIT')
                  pos=c+6
          print('transaction-callsite-audit-ok')
          PY

  reproducible-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build candidate twice and report exact digests
        run: |
          set -euo pipefail
          a=/tmp/06-homeopathy-encyclopedia-foundation-2.4.12-a.zip
          b=/tmp/06-homeopathy-encyclopedia-foundation-2.4.12-b.zip
          python3 scripts/build-release.py --source homeopathy-encyclopedia --output "$a"
          python3 scripts/build-release.py --source homeopathy-encyclopedia --output "$b"
          cmp -s "$a" "$b"
          echo "PACKAGE_SHA256=$(sha256sum "$a" | awk '{print $1}')"
          echo "PACKAGE_BYTES=$(stat -c '%s' "$a")"
          echo "SOURCE_TREE_SHA256=$(python3 scripts/source-tree-hash.py homeopathy-encyclopedia | tail -n1 | tr -d '[:space:]')"
          python3 - <<'PY'
          import zipfile
          p='/tmp/06-homeopathy-encyclopedia-foundation-2.4.12-a.zip'
          with zipfile.ZipFile(p) as z:
              names=z.namelist(); assert names and all(n.startswith('06-homeopathy-encyclopedia-foundation/') for n in names)
              b=z.read('06-homeopathy-encyclopedia-foundation/homeopathy-encyclopedia.php').decode(); r=z.read('06-homeopathy-encyclopedia-foundation/readme.txt').decode()
              assert ' * Version: 2.4.12' in b and "define( 'HE_VERSION', '2.4.12' )" in b
              assert "define( 'HE_SCHEMA_VERSION', 10 )" in b and "define( 'HE_CONTRACT_VERSION', '2.4.12' )" in b
              assert "'future_hardening_version'=>'2.4.12'" in b and 'Stable tag: 2.4.12' in r
          PY

  wordpress-smoke:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          extensions: mysqli,mbstring
          coverage: none
      - name: Install WP-CLI
        run: |
          curl -fsSLo /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar && sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp --info
      - name: WordPress 7.0.1 lifecycle smoke with strict runtime-log gate
        run: |
          set -euo pipefail
          fail_noise(){ if grep -Eiq 'WordPress database error|PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' "$1"; then cat "$1" >&2; exit 1; fi; }
          run_clean(){ local log; log="$(mktemp)"; "$@" >"$log" 2>&1; cat "$log"; fail_noise "$log"; rm -f "$log"; }
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --version=7.0.1 --force
          wp config create --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          wp core install --url=http://file06.test --title='File 06 CI' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          cp -R "$GITHUB_WORKSPACE/homeopathy-encyclopedia" wp-content/plugins/homeopathy-encyclopedia
          run_clean wp plugin activate homeopathy-encyclopedia
          run_clean wp eval 'if(HE_VERSION!=="2.4.12"||HE_SCHEMA_VERSION!==10||HE_CONTRACT_VERSION!=="2.4.12"){throw new Exception("runtime contract mismatch");}$c=he_contract_descriptor();if(($c["future_hardening_version"]??"")!=="2.4.12"){throw new Exception("future hardening mismatch");}echo "runtime-contract-ok\n";'
          run_clean wp eval 'if(HE_V24_Future_Schema::VERSION!==2||(int)get_option(HE_V24_Future_Schema::OPTION_VERSION,0)!==2||!HE_V24_Migration_Safety::ready()){throw new Exception("future migration/schema mismatch");}echo "future-migration-ready\n";'
          run_clean wp eval 'global $wpdb;foreach(array("claims","claim_evidence","provenance","external_records","concept_mappings","similarity","researcher_ids","freshness","impact_queue","research_gaps","watchlists","translations") as $name){$t=HE_V24_Future_Schema::table($name);if($t!==$wpdb->get_var($wpdb->prepare("SHOW TABLES LIKE %s",$t))){throw new Exception("missing future table ".$name);}}echo "future-schema-tables-ok\n";'
          run_clean wp eval 'wp_set_current_user(1);do_action("rest_api_init");$r=rest_do_request(new WP_REST_Request("GET","/sabri/v2/file-06/health"));if($r->get_status()!==503){throw new Exception("health route did not fail closed without File00: ".$r->get_status());}echo "health-file00-failclosed-ok\n";'
          run_clean wp eval '$x=HE_V2_Domain::sanitize_text_list(array(array("name"=>"Ada"),array("statement"=>"none conflicts"),array(array("text"=>"Nested"))));if($x!==array("Ada","none conflicts","Nested")){throw new Exception("nested text-list normalization mismatch: ".wp_json_encode($x));}echo "v2412-text-list-ok\n";'
          run_clean wp eval '$a=HE_V2_Domain::idempotent_begin(1,"ci-v2412","ci-key-12345678",array("x"=>1));if(is_wp_error($a)||!empty($a["replay"])||empty($a["id"])){throw new Exception("idempotency reserve failed");}if(!HE_V2_Domain::idempotent_finish($a["id"],200,array("ok"=>1))){throw new Exception("idempotency finish failed");}$b=HE_V2_Domain::idempotent_begin(1,"ci-v2412","ci-key-12345678",array("x"=>1));if(is_wp_error($b)||empty($b["replay"])||(int)$b["code"]!==200){throw new Exception("idempotency replay failed");}echo "v2412-idempotency-ok\n";'
          run_clean wp eval 'if(!HE_V2_Domain::rate_allow("ci-v2412-rate",2,60)||!HE_V2_Domain::rate_allow("ci-v2412-rate",2,60)||HE_V2_Domain::rate_allow("ci-v2412-rate",2,60)){throw new Exception("rate limiter failed");}echo "v2412-rate-limit-ok\n";'
          run_clean wp eval '$e=HE_V2_Domain::emit_event("File06CISmoke.v1","concept",0,array("email"=>"private@example.test","note"=>"call +923001234567"));global $wpdb;$payload=$wpdb->get_var($wpdb->prepare("SELECT payload_json FROM ".HE_V2_Schema::table("events")." WHERE event_id=%s",$e["event_id"]));if(strpos($payload,"private@example.test")!==false||strpos($payload,"+923001234567")!==false||strpos($payload,"[redacted]")===false){throw new Exception("event minimization failed: ".$payload);}HE_V2_Integrations::process_outbox(10);$status=$wpdb->get_var($wpdb->prepare("SELECT status FROM ".HE_V2_Schema::table("outbox")." WHERE event_id=%s",$e["event_id"]));if($status!=="delivered"){throw new Exception("outbox delivery failed");}echo "v2412-event-minimization-outbox-ok\n";'
          run_clean wp eval 'if(!has_filter("posts_where",array("HE_V22_Public_Guard","research_public_query_where"))||!has_filter("posts_results",array("HE_V22_Public_Guard","research_public_query_results"))){throw new Exception("research query/result guard missing");}echo "v2412-research-query-result-guards-ok\n";'
          run_clean wp eval 'wp_set_current_user(1);if(HE_V2_Auth::provider_ready()){throw new Exception("File00 unexpectedly present");}HE_V22_Governance::resume_background_work();echo "v2412-maintenance-failclosed-ok\n";'
          run_clean wp plugin deactivate homeopathy-encyclopedia
          run_clean wp plugin activate homeopathy-encyclopedia
          run_clean wp eval 'if((int)get_option(HE_V2_Schema::OPTION_SCHEMA,0)!==10||(int)get_option(HE_V24_Future_Schema::OPTION_VERSION,0)!==2||!HE_V24_Migration_Safety::ready()){throw new Exception("reactivation mismatch");}echo "reactivation-ok\n";'
