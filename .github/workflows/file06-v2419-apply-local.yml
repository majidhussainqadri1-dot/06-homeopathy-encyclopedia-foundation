name: File 06 v2.4.19 Apply Reviewed Patch

on:
  push:
    branches:
      - audit/file-06-v2419-sync-test
    paths:
      - .github/workflows/file06-v2419-apply-local.yml

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Reconstruct and apply reviewed patch
        run: |
          set -euo pipefail
          cat .github/patchparts/file06-v2419.part* > /tmp/file06-v2419.patch.gz.b64
          base64 -d /tmp/file06-v2419.patch.gz.b64 | gzip -dc > /tmp/file06-v2419.patch
          git apply --check /tmp/file06-v2419.patch
          git apply /tmp/file06-v2419.patch
      - name: Full File 06 regression and deterministic package gate
        run: |
          set -euo pipefail
          bash tests/run-all.sh
      - name: Commit reviewed corrections and remove transport helpers
        run: |
          set -euo pipefail
          rm -rf .github/patchparts
          rm -f .github/workflows/file06-v2419-apply-local.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(file-06): complete twentieth 20-round review corrections'
          git push origin HEAD:${GITHUB_REF_NAME}
