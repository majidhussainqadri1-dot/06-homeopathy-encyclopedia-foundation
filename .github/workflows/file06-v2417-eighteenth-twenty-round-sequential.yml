name: File 06 v2.4.17 Eighteenth Sequential Twenty-Round Review
on:
  push:
    branches: [audit/file-06-eighteenth-twenty-round-v2.4.17]
    paths: [.github/workflows/file06-v2417-eighteenth-twenty-round-sequential.yml]
permissions:
  contents: write
jobs:
  review-fix-retest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Resume sequential review correction rounds 13-20
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          python3 -m py_compile scripts/v2417-eighteenth-twenty-round-fixes.py
          for round in $(seq 13 20); do
            echo "===== File 06 eighteenth review round ${round} ====="
            python3 scripts/v2417-eighteenth-twenty-round-fixes.py "$round"
            if [ "$round" = "13" ]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path('homeopathy-encyclopedia/includes/class-he-v24-future-api.php')
          s=p.read_text(encoding='utf-8')
          old="$reference_id=absint($data['reference_id']??0);$external_id=sanitize_text_field($data['external_id']??'');$external_token=''; if(!$reference_id&&!$external_id){throw new RuntimeException('evidence-required');}"
          new="$reference_token=sanitize_text_field((string)($data['reference_id']??''));$reference_id=$reference_token?HE_V2_Domain::decode_public_cursor('reference',$reference_token):0;$external_id=sanitize_text_field($data['external_id']??'');$external_token=''; if((null===$reference_id||!$reference_id)&&!$external_id){throw new RuntimeException('evidence-required');}"
          if old not in s:
              raise SystemExit('R13 raw reference identifier pattern not found after base correction')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
            fi
            while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
            node --check homeopathy-encyclopedia/assets/js/encyclopedia-v2.js
            FILE06_REVIEW_ROUND="$round" php tests/v2417-eighteenth-twenty-round-regressions.php 2>&1 | tee "/tmp/v2417-target-${round}.log"
            bash tests/run-all.sh 2>&1 | tee "/tmp/v2417-round-${round}.log"
            if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' "/tmp/v2417-target-${round}.log" "/tmp/v2417-round-${round}.log"; then
              echo "Unexpected PHP warning/error in round ${round}" >&2
              exit 1
            fi
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "fix(file-06): eighteenth review round ${round} correction"
              git push origin HEAD:audit/file-06-eighteenth-twenty-round-v2.4.17
            else
              echo "Round ${round} produced no repository mutation after audit."
            fi
          done
          echo "All twenty eighteenth-cycle review/fix/retest rounds completed."
