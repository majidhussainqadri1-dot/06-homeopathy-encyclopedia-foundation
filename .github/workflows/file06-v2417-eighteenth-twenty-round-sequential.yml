name: File 06 v2.4.17 Eighteenth Sequential Twenty-Round Review
on:
  push:
    branches: [audit/file-06-eighteenth-twenty-round-v2.4.17]
    paths: [.github/workflows/file06-v2417-eighteenth-twenty-round-sequential.yml]
permissions:
  contents: write
jobs:
  review-fix-retest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Diagnose R13 correction markers
        run: |
          set -euo pipefail
          python3 scripts/v2417-eighteenth-twenty-round-fixes.py 13
          php -l homeopathy-encyclopedia/includes/class-he-v24-future-api.php
          echo '=== reference decode ==='
          grep -n "decode_public_cursor" homeopathy-encyclopedia/includes/class-he-v24-future-api.php | head -20 || true
          echo '=== external record encode ==='
          grep -n "external-record" homeopathy-encyclopedia/includes/class-he-v24-future-api.php | head -30 || true
          echo '=== binding resolver ==='
          grep -n "resolve_external_binding\|public_binding\|public_id.*public" homeopathy-encyclopedia/includes/class-he-v24-future-api.php | head -50 || true
          FILE06_REVIEW_ROUND=13 php tests/v2417-eighteenth-twenty-round-regressions.php || true
          exit 0
