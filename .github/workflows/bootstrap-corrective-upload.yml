name: File 06 Corrective Bootstrap

on:
  push:
    branches: [ audit/file-06-source-review ]
    paths:
      - '.file06-bootstrap/**'

permissions:
  contents: write

jobs:
  apply-corrective-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: audit/file-06-source-review
      - name: Reassemble and verify corrective overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .file06-bootstrap/overlay.part* > /tmp/file06-overlay.b64
          base64 --decode /tmp/file06-overlay.b64 > /tmp/file06-overlay.tar.gz
          echo 'd70a124f79daf81d47263b2acc688b45a8fcc0661534bafa7d805edcfddb7aa8  /tmp/file06-overlay.tar.gz' | sha256sum --check --strict
          if tar -tzf /tmp/file06-overlay.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe archive path detected.' >&2
            exit 1
          fi
          tar -xzf /tmp/file06-overlay.tar.gz -C .
      - name: Validate corrected source before commit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find homeopathy-encyclopedia tests -type f -name '*.php' -print0 | sort -z)
          sha256sum --check --strict CORRECTIVE-CHECKSUMS.sha256
          bash tests/source-invariants.sh
          php tests/security-invariants.php
          python3 scripts/build-release.py --source homeopathy-encyclopedia --output /tmp/file06-a.zip
          python3 scripts/build-release.py --source homeopathy-encyclopedia --output /tmp/file06-b.zip
          cmp -s /tmp/file06-a.zip /tmp/file06-b.zip
          echo '14800cf27df796b0972164b0bb75922ce9d851c35f7a7e31a4a95943b1149fb1  /tmp/file06-a.zip' | sha256sum --check --strict
          test "$(stat -c '%s' /tmp/file06-a.zip)" -eq 44284
      - name: Commit complete corrective source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add homeopathy-encyclopedia CORRECTIVE-CHECKSUMS.sha256 CORRECTIVE-MANIFEST.md CORRECTIVE-REVIEW.md README.md STATUS.md scripts tests
          git diff --cached --quiet && exit 0
          git commit -m 'Remediate File 06 audit blockers and add corrective QA'
          git push origin HEAD:audit/file-06-source-review
