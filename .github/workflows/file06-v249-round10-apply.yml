name: File 06 v2.4.9 Round 10 Apply
on:
  push:
    paths:
      - .github/workflows/file06-v249-round10-apply.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/file-06-tenth-ten-round-v2.4.9
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply v2.4.9 release-truth correction
        run: python3 scripts/v249-round10-fix.py
      - name: Verify Round 10 corrected state
        run: |
          set -euo pipefail
          php -l homeopathy-encyclopedia/homeopathy-encyclopedia.php
          php -l tests/v249-tenth-ten-round-regressions.php
          php -l tests/v248-ninth-ten-round-regressions.php
          php tests/v249-tenth-ten-round-regressions.php
          bash tests/run-all.sh 2>&1 | tee /tmp/file06-r10.log
          if grep -Eiq 'PHP (Warning|Fatal error|Parse error)|(^|[[:space:]])Warning:|Fatal error:|Parse error:' /tmp/file06-r10.log; then exit 1; fi
          grep -q 'Stable tag: 2.4.9' homeopathy-encyclopedia/readme.txt
          grep -q '2.4.9' README.md STATUS.md docs/RELEASE-NOTES.md docs/RELEASE-SIGNOFF.md docs/TEST-REPORT.md
          git diff --check
      - name: Commit Round 10 correction
        run: |
          git config user.name majidhussainqadri1-dot
          git config user.email majidhussainqadri1@gmail.com
          git add homeopathy-encyclopedia/homeopathy-encyclopedia.php homeopathy-encyclopedia/readme.txt tests/run-all.sh tests/v2-invariants.php tests/v2-source-invariants.sh tests/v23-future-invariants.php tests/v24-80-round-invariants.php tests/v241-second-80-invariants.php tests/v242-third-80-final.php tests/v248-ninth-ten-round-regressions.php tests/v249-tenth-ten-round-regressions.php README.md STATUS.md CHANGELOG.md docs/RELEASE-NOTES.md docs/RELEASE-SIGNOFF.md docs/TEST-REPORT.md
          git commit -m 'fix(file-06): align tenth-cycle candidate release truth to v2.4.9'
          git push origin HEAD:audit/file-06-tenth-ten-round-v2.4.9
