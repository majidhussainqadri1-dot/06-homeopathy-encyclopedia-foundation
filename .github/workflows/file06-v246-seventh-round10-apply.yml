name: File 06 v2.4.6 Seventh Review Round 10 Apply
on:
  push:
    branches:
      - audit/file-06-seventh-ten-round-v2.4.6
    paths:
      - .github/workflows/file06-v246-seventh-round10-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/file-06-seventh-ten-round-v2.4.6
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Align runtime and aggregate QA to v2.4.6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('homeopathy-encyclopedia/homeopathy-encyclopedia.php')
          s=p.read_text()
          if '2.4.5' not in s: raise SystemExit('bootstrap prior version marker missing')
          p.write_text(s.replace('2.4.5','2.4.6'))
          p=Path('homeopathy-encyclopedia/readme.txt')
          s=p.read_text().replace('Stable tag: 2.4.5','Stable tag: 2.4.6',1).replace('The 2.4.5 candidate','The 2.4.6 candidate',1)
          marker='== Changelog ==\n\n'
          entry="= 2.4.6 =\n* Seventh ten-round corrective candidate: fail-closed research state/public surfaces, governed taxonomy REST ownership, successful-case privacy, publication-gated public identifiers, and retry-safe maintenance cursors.\n\n"
          if '= 2.4.6 =' not in s:
              if marker not in s: raise SystemExit('plugin changelog marker missing')
              s=s.replace(marker,marker+entry,1)
          p.write_text(s)
          for name in ['tests/v2-invariants.php','tests/v2-source-invariants.sh','tests/v23-future-invariants.php','tests/v24-80-round-invariants.php','tests/v241-second-80-invariants.php','tests/v242-third-80-final.php']:
              q=Path(name); x=q.read_text()
              if '2.4.5' not in x: raise SystemExit('current candidate version marker missing in '+name)
              q.write_text(x.replace('2.4.5','2.4.6'))
          q=Path('tests/test-file06-v245-sixth-ten-round-regressions.php'); x=q.read_text()
          reps=[
              ("f06_v245_assert(strpos($bootstrap, ' * Version: 2.4.5') !== false, 'Round 10 plugin header version not 2.4.5');","f06_v245_assert(strpos($bootstrap, ' * Version:') !== false, 'Historical Round 10 plugin header declaration missing');"),
              ("f06_v245_assert(strpos($bootstrap, \"define( 'HE_VERSION', '2.4.5' );\") !== false, 'Round 10 runtime version not 2.4.5');","f06_v245_assert(strpos($bootstrap, \"define( 'HE_VERSION',\") !== false, 'Historical Round 10 runtime declaration missing');"),
              ("f06_v245_assert(strpos($bootstrap, \"define( 'HE_CONTRACT_VERSION', '2.4.5' );\") !== false, 'Round 10 contract version not 2.4.5');","f06_v245_assert(strpos($bootstrap, \"define( 'HE_CONTRACT_VERSION',\") !== false, 'Historical Round 10 contract declaration missing');"),
              ("f06_v245_assert(strpos($bootstrap, \"'future_hardening_version'=>'2.4.5'\") !== false, 'Round 10 hardening version not 2.4.5');","f06_v245_assert(strpos($bootstrap, \"'future_hardening_version'=>\") !== false, 'Historical Round 10 hardening declaration missing');"),
              ("f06_v245_assert(strpos($runall, 'file06-v2.4.5-a.zip') !== false && strpos($runall, 'file06-v2.4.5-b.zip') !== false, 'Round 10 package labels not 2.4.5');","f06_v245_assert(strpos($runall, '-a.zip') !== false && strpos($runall, '-b.zip') !== false, 'Historical deterministic package labels missing');")
          ]
          for old,new in reps:
              if old not in x: raise SystemExit('historical v245 marker missing')
              x=x.replace(old,new,1)
          q.write_text(x)
          q=Path('tests/run-all.sh'); x=q.read_text()
          anchor='php "$root/tests/test-file06-v245-sixth-ten-round-regressions.php"\n'
          if 'v246-seventh-ten-round-regressions.php' not in x:
              if anchor not in x: raise SystemExit('aggregate anchor missing')
              x=x.replace(anchor,anchor+'php "$root/tests/v246-seventh-ten-round-regressions.php"\n',1)
          x=x.replace('file06-v2.4.5-a.zip','file06-v2.4.6-a.zip').replace('file06-v2.4.5-b.zip','file06-v2.4.6-b.zip')
          x=x.replace('All File 06 v2.4.5 automated checks, inherited review matrices, sixth ten-round regressions and deterministic package comparison passed.','All File 06 v2.4.6 automated checks, inherited review matrices, seventh ten-round regressions and deterministic package comparison passed.')
          q.write_text(x)
          q=Path('tests/v246-seventh-ten-round-regressions.php'); x=q.read_text(); marker='/*__V246_MORE__*/'
          block="$bootstrap=v246_read($root.'/homeopathy-encyclopedia/homeopathy-encyclopedia.php');\n$runall=v246_read($root.'/tests/run-all.sh');\nv246_ok(false!==strpos($bootstrap,' * Version: 2.4.6') && false!==strpos($bootstrap,\"define( 'HE_VERSION', '2.4.6' );\") && false!==strpos($bootstrap,\"define( 'HE_CONTRACT_VERSION', '2.4.6' );\"),'R10 runtime/contract version truth not 2.4.6');\nv246_ok(false!==strpos($bootstrap,\"'future_hardening_version'=>'2.4.6'\"),'R10 hardening version drift');\nv246_ok(false!==strpos($runall,'v246-seventh-ten-round-regressions.php'),'R10 seventh-cycle suite absent from aggregate gate');\nv246_ok(false!==strpos($runall,'file06-v2.4.6-a.zip') && false!==strpos($runall,'file06-v2.4.6-b.zip'),'R10 package labels not 2.4.6');\n"
          if marker not in x: raise SystemExit('v246 marker missing')
          q.write_text(x.replace(marker,block+marker,1))
          PY
          php -l homeopathy-encyclopedia/homeopathy-encyclopedia.php
          php -l tests/v246-seventh-ten-round-regressions.php
          php -l tests/test-file06-v245-sixth-ten-round-regressions.php
          php tests/v246-seventh-ten-round-regressions.php
          bash tests/run-all.sh
          git diff --check
      - name: Commit Round 10 runtime and QA correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name majidhussainqadri1-dot
          git config user.email majidhussainqadri1@gmail.com
          git add homeopathy-encyclopedia/homeopathy-encyclopedia.php homeopathy-encyclopedia/readme.txt tests
          git commit -m 'fix(file-06): align v2.4.6 runtime and aggregate QA'
          git push origin HEAD:audit/file-06-seventh-ten-round-v2.4.6
